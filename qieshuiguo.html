<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#3a2412">
<title>切水果</title>
<link rel="icon" href="data:,">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    -webkit-user-select:none;user-select:none;color:#ffe14d;overflow:hidden;touch-action:manipulation;
    background:radial-gradient(circle at 50% -10%,#5c3a1e 0%,#3f2814 55%,#241505 100%)}
  body{display:flex;flex-direction:column}
  /* —— 顶部信息栏 —— */
  #hud{display:flex;align-items:center;gap:8px;padding:8px 10px 6px;z-index:5;flex:none;flex-wrap:wrap}
  .badge{background:linear-gradient(180deg,#fff6dd,#f4dfae);border:3px solid #8a5a2a;border-radius:14px;color:#4a2c07;
    box-shadow:0 3px 0 #5a3a16,0 6px 12px rgba(0,0,0,.3);padding:4px 12px;text-align:center;min-width:70px}
  .badge .lab{font-size:11px;color:#8a6a3a;letter-spacing:2px}
  .badge .val{font-size:18px;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums}
  #comboB{display:none;min-width:60px}
  #comboB .val{color:#e05a2a;animation:pulseC .5s infinite}
  @keyframes pulseC{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
  #timerBox .val.low{color:#e03040;animation:pulseC .8s infinite}
  #levelBox .val.hot{color:#e07020}
  #livesBox .val{font-size:16px;letter-spacing:3px}
  #livesBox .ok{color:#e03040}
  #livesBox .lost{color:#b8a480;opacity:.55}
  .grow{flex:1}
  .iconBtn{width:44px;height:44px;border-radius:12px;border:3px solid #8a5a2a;cursor:pointer;font-size:19px;line-height:1;
    background:linear-gradient(180deg,#fff6dd,#f4dfae);box-shadow:0 3px 0 #5a3a16,0 6px 12px rgba(0,0,0,.3);color:#4a2c07;font-weight:900}
  .iconBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #5a3a16}
  #fxBar{display:flex;gap:6px;padding:0 10px 6px;flex-wrap:wrap;flex:none}
  #fxBar:empty{display:none}
  .fxChip{font-size:11px;color:#4a2c07;background:linear-gradient(180deg,#fff6dd,#f4dfae);
    border:2px solid #8a5a2a;border-radius:999px;padding:2px 10px;
    box-shadow:0 2px 0 #5a3a16;letter-spacing:.5px;white-space:nowrap}
  .fxChip b{font-weight:900}
  .fxChip.res{background:linear-gradient(180deg,#f0e2ff,#d8c2f5);border-color:#7a4ac0;
    color:#4a2a80;box-shadow:0 2px 0 #7a4ac0;animation:pulseC 1.6s infinite}
  .iconBtn.off{opacity:.4}
  /* —— 舞台 —— */
  #stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px 10px}
  #cv{display:block;border-radius:18px;box-shadow:0 0 0 4px #8a5a2a,0 7px 0 #5a3a16,0 18px 36px rgba(0,0,0,.55);
    touch-action:none;cursor:crosshair;background:#2c1a0c}
  /* —— 覆盖层 —— */
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:8}
  .overlay.hidden{display:none}
  .panel{pointer-events:auto;background:linear-gradient(180deg,rgba(255,249,226,.97),rgba(238,226,192,.97));
    border:4px solid #8a5a2a;border-radius:22px;box-shadow:0 8px 0 #5a3a16,0 24px 48px rgba(0,0,0,.55);
    padding:18px 22px;display:flex;flex-direction:column;align-items:center;gap:11px;max-width:min(94vw,440px);
    max-height:94%;overflow:auto}
  .panel.wide{max-width:min(96vw,620px)}
  .panel h1{margin:0;font-size:38px;color:#ffe14d;-webkit-text-stroke:2px #4a2c07;
    text-shadow:0 4px 0 #4a2c07,0 10px 22px rgba(0,0,0,.35);letter-spacing:9px}
  .panel h2{margin:0;font-size:26px;color:#e05a2a;-webkit-text-stroke:1.2px #4a2c07;text-shadow:0 3px 0 #4a2c07;letter-spacing:5px}
  .tip{margin:0;font-size:13px;color:#6a5230;text-align:center;line-height:1.65}
  .tip.small{font-size:11px;color:#8a6a3a}
  /* 进度条 */
  .prog{width:100%;background:rgba(255,246,221,.6);border:2.5px solid #8a5a2a;border-radius:14px;padding:8px 14px;box-shadow:inset 0 2px 6px rgba(0,0,0,.12)}
  .prow{display:flex;justify-content:space-between;font-size:14px;color:#4a2c07;font-weight:700;margin-bottom:6px}
  .prow b{color:#e05a2a}
  .pbar{height:14px;background:#fff2cf;border:2px solid #8a5a2a;border-radius:999px;overflow:hidden}
  #pfill{height:100%;width:0%;border-radius:999px;transition:width .4s ease;
    background:linear-gradient(90deg,#7ec850,#55c53a 60%,#ffc233)}
  .psub{font-size:11px;color:#8a6a3a;margin-top:5px;text-align:center}
  .modes{display:flex;flex-direction:column;gap:9px;width:100%}
  .modeBtn{display:flex;flex-direction:column;gap:2px;cursor:pointer;font-family:inherit;text-align:left;
    border-radius:14px;padding:9px 16px;color:#fff;transition:transform .12s;letter-spacing:1px}
  .modeBtn:hover{transform:translateY(-2px)}
  .modeBtn:active{transform:translateY(2px)}
  .modeBtn .mrow{display:flex;justify-content:space-between;align-items:baseline;width:100%}
  .modeBtn b{font-size:17px;letter-spacing:3px}
  .modeBtn em{font-style:normal;font-size:11.5px;color:#ffe14d}
  .modeBtn span{font-size:11.5px;opacity:.94}
  .modeBtn.classic{background:linear-gradient(180deg,#9ade54,#55a326);border:3px solid #2c6a14;box-shadow:0 4px 0 #2c6a14}
  .modeBtn.classic:active{box-shadow:0 1px 0 #2c6a14}
  .modeBtn.arcade{background:linear-gradient(180deg,#ffc06a,#ee8a2a);border:3px solid #9a4a10;box-shadow:0 4px 0 #9a4a10}
  .modeBtn.arcade:active{box-shadow:0 1px 0 #9a4a10}
  .modeBtn.zen{background:linear-gradient(180deg,#8ed4f0,#4a9ad0);border:3px solid #1e5a8a;box-shadow:0 4px 0 #1e5a8a}
  .modeBtn.zen:active{box-shadow:0 1px 0 #1e5a8a}
  .modeBtn.equip{background:linear-gradient(180deg,#c9a4f0,#8a54d0);border:3px solid #4a2a80;box-shadow:0 4px 0 #4a2a80}
  .modeBtn.equip:active{box-shadow:0 1px 0 #4a2a80}
  /* 关卡网格 */
  .lvlGrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;width:100%;padding:2px}
  .lvlBtn{aspect-ratio:1;border-radius:9px;border:2.5px solid #2c6a14;cursor:pointer;font-family:inherit;
    font-size:14px;font-weight:900;color:#fff;background:linear-gradient(180deg,#9ade54,#55a326);
    box-shadow:0 3px 0 #2c6a14;display:flex;align-items:center;justify-content:center;position:relative}
  .lvlBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #2c6a14}
  .lvlBtn.frenzy{background:linear-gradient(180deg,#ff9a4d,#e8601a);border-color:#9a400a;box-shadow:0 3px 0 #9a400a;font-size:12px}
  .lvlBtn.locked{background:linear-gradient(180deg,#d8cbb0,#b8a888);border-color:#8a7a5a;box-shadow:0 3px 0 #8a7a5a;
    color:#7a6a4a;cursor:not-allowed;font-size:12px}
  .lvlBtn.locked.frenzy{background:linear-gradient(180deg,#d8a888,#b07858);border-color:#8a5838;box-shadow:0 3px 0 #8a5838;color:#6a4838}
  .lvlBtn.done::after{content:"★";position:absolute;top:1px;right:3px;font-size:9px;color:#ffe14d}
  .lvlBtn.cur{outline:3px solid #ffe14d;outline-offset:1px}
  /* 装备库 */
  .resBox{width:100%;border:2.5px solid #8a5a2a;border-radius:12px;padding:7px 12px;font-size:12.5px;color:#4a2c07;
    background:rgba(255,246,221,.7);line-height:1.5}
  .resBox.on{border-color:#c9a4f0;background:rgba(240,225,255,.85);font-weight:700}
  .eqCols{display:flex;gap:10px;width:100%;align-items:stretch}
  .eqCol{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
  .eqTitle{font-size:14px;font-weight:900;color:#4a2c07;letter-spacing:2px}
  .eqTitle span{font-weight:400;font-size:11px;color:#8a6a3a}
  .eqList{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow-y:auto;padding-right:4px}
  .eqItem{border:2px solid #b09868;border-radius:10px;padding:6px 10px;background:rgba(255,248,230,.85);cursor:pointer;
    display:flex;flex-direction:column;gap:2px}
  .eqItem:hover{border-color:#e05a2a}
  .eqItem .erow{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .eqItem b{font-size:13px;color:#4a2c07;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .eqItem .elc{font-size:10.5px;font-weight:900;color:#fff;border-radius:999px;padding:1px 7px;flex:none}
  .eqItem span{font-size:10.5px;color:#7a6238;line-height:1.5}
  .eqItem .blPrev{width:75px;height:16px;flex:none}
  .eqItem .wpPrev{width:38px;height:22px;flex:none}
  .eqItem.locked{opacity:.5;cursor:not-allowed;background:rgba(230,220,195,.7)}
  .eqItem.equipped{border-color:#2c6a14;background:rgba(220,245,205,.95);box-shadow:0 0 0 2px rgba(85,163,38,.35)}
  .stats{display:flex;gap:22px}
  .stat{text-align:center}
  .stat .n{font-size:24px;font-weight:900;color:#4a2c07;font-variant-numeric:tabular-nums}
  .stat .l{font-size:11px;color:#8a6a3a;letter-spacing:2px}
  #newBest{color:#e03040;font-weight:900;font-size:15px;letter-spacing:2px;animation:pulseC .7s infinite}
  #unlockInfo{display:none;width:100%;border:2.5px dashed #c9a4f0;border-radius:12px;padding:7px 12px;
    font-size:12.5px;color:#6a3aa0;background:rgba(240,230,255,.8);line-height:1.6;text-align:center}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btn{font-family:inherit;cursor:pointer;font-size:15px;font-weight:700;letter-spacing:3px;color:#4a2c07;
    background:linear-gradient(#ffe9ad,#f0cd76);border:3px solid #8a5a2a;border-radius:12px;padding:9px 20px;
    box-shadow:0 4px 0 #5a3a16;transition:transform .12s}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #5a3a16}
  .btn.primary{color:#fff;background:linear-gradient(#9ade54,#55a326);border-color:#2c6a14;box-shadow:0 4px 0 #2c6a14}
  .btn.primary:active{box-shadow:0 1px 0 #2c6a14}
  .btn.danger{color:#fff;background:linear-gradient(#ff9a8a,#e0503a);border-color:#8a1a0a;box-shadow:0 4px 0 #8a1a0a}
  .btn.danger:active{box-shadow:0 1px 0 #8a1a0a}
  .miniBtn{font-family:inherit;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:2px;color:#6a5230;
    background:linear-gradient(#fff6dd,#f0e0b8);border:2px solid #8a5a2a;border-radius:10px;padding:6px 18px;
    box-shadow:0 3px 0 #5a3a16;margin-top:6px}
  .miniBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #5a3a16}
  /* —— 封面 —— */
  #cover{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    cursor:pointer;background:radial-gradient(circle at 50% 32%,#54331b 0%,#31200e 58%,#1a0f06 100%)}
  #cover.hidden{display:none}
  .coverInner{display:flex;flex-direction:column;align-items:center;gap:12px;
    animation:coverIn .55s ease both;padding:12px}
  @keyframes coverIn{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .ctitle{font-size:clamp(42px,9vw,72px);font-weight:900;color:#ffe14d;-webkit-text-stroke:3px #4a2c07;
    text-shadow:0 6px 0 #4a2c07,0 14px 34px rgba(0,0,0,.6);letter-spacing:18px;
    animation:titleGlow 2.4s ease-in-out infinite}
  @keyframes titleGlow{0%,100%{filter:drop-shadow(0 0 6px rgba(255,225,77,.3))}50%{filter:drop-shadow(0 0 18px rgba(255,225,77,.7))}}
  #coverCv{width:min(88vw,560px);height:auto;border-radius:16px;
    box-shadow:0 0 0 4px #8a5a2a,0 7px 0 #5a3a16,0 16px 36px rgba(0,0,0,.6);
    animation:coverFloat 3.2s ease-in-out infinite alternate}
  @keyframes coverFloat{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
  .csub{font-size:13px;color:#d8c5a0;letter-spacing:2px;text-shadow:0 2px 3px rgba(0,0,0,.5);text-align:center}
  .cprompt{margin-top:4px;font-size:18px;font-weight:900;letter-spacing:6px;color:#fff;
    background:linear-gradient(#9ade54,#55a326);border:3px solid #2c6a14;border-radius:14px;padding:10px 44px;
    box-shadow:0 5px 0 #2c6a14,0 10px 22px rgba(0,0,0,.45);animation:pulseC 1.4s infinite}
  /* —— 开场倒计时 —— */
  #count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:9;
    font-size:clamp(70px,15vw,118px);font-weight:900;color:#ffe14d;-webkit-text-stroke:4px #4a2c07;
    text-shadow:0 8px 0 #4a2c07,0 16px 40px rgba(0,0,0,.6)}
  #count.hidden{display:none}
  .pop{animation:cpop .95s ease both}
  @keyframes cpop{0%{transform:scale(.15);opacity:0}25%{transform:scale(1.3);opacity:1}45%{transform:scale(1)}80%{opacity:1}100%{transform:scale(1);opacity:0}}
  @media (max-width:640px){
    .panel h1{font-size:30px;letter-spacing:6px}.panel h2{font-size:22px}
    .badge{min-width:56px;padding:3px 8px}.badge .val{font-size:15px}.stats{gap:14px}
    .lvlGrid{grid-template-columns:repeat(6,1fr)}
    .eqCols{flex-direction:column}.eqList{max-height:200px}
  }
</style>
</head>
<body>
  <div id="hud">
    <div class="badge"><div class="lab">分数</div><div class="val" id="scoreV">0</div></div>
    <div class="badge" id="comboB"><div class="lab">连击</div><div class="val" id="comboV">×2</div></div>
    <div class="badge" id="levelBox" style="display:none"><div class="lab">关卡</div><div class="val" id="levelV">1</div></div>
    <div class="grow"></div>
    <div class="badge" id="timerBox" style="display:none"><div class="lab">时间</div><div class="val" id="timeV">60</div></div>
    <div class="badge" id="livesBox" style="display:none"><div class="lab">生命</div><div class="val" id="livesV"></div></div>
    <button class="iconBtn" id="sndBtn" title="音效 (M)">🔊</button>
    <button class="iconBtn" id="musBtn" title="背景音乐 (N)">🎵</button>
    <button class="iconBtn" id="pauseBtn" title="暂停 (P)">⏸</button>
  </div>
  <div id="fxBar"></div>
  <div id="stage">
    <div id="cover">
      <div class="coverInner">
        <div class="ctitle">切 水 果</div>
        <canvas id="coverCv" width="1120" height="560"></canvas>
        <div class="csub">水果忍者式街机 · 100 关挑战 · 50 壁纸 × 50 刀 · 元素共鸣</div>
        <div class="cprompt">▶ 点击开始</div>
      </div>
    </div>
    <canvas id="cv"></canvas>
    <div id="count" class="hidden">3</div>
    <div id="menu" class="overlay">
      <div class="panel">
        <h1>切 水 果</h1>
        <div class="prog">
          <div class="prow"><span>第 <b id="lvlNow">1</b> 关 / 100</span><span>总分 <b id="totalV">0</b></span></div>
          <div class="pbar"><div id="pfill"></div></div>
          <div class="psub" id="unlockHint"></div>
        </div>
        <div class="modes">
          <button class="modeBtn classic" id="btnLevels">
            <div class="mrow"><b>关卡挑战</b><em id="lvlBtnEm">已解锁 1 关</em></div>
            <span>100 关 · 每 100 分解锁下一关 · 每 2 关解锁壁纸与刀</span>
          </button>
          <button class="modeBtn equip" id="btnEquip">
            <div class="mrow"><b>装备库</b><em id="eqBtnEm"></em></div>
            <span>50 张壁纸 × 50 把刀 · 各带能力 · 同元素共鸣触发配合技</span>
          </button>
          <button class="modeBtn arcade" data-mode="arcade">
            <div class="mrow"><b>街机模式</b><em id="best-arcade">最佳 0</em></div>
            <span>60 秒限时 · 炸弹扣分 · ❄冰冻 🔥狂热 ⭐双倍魔法香蕉</span>
          </button>
          <button class="modeBtn zen" data-mode="zen">
            <div class="mrow"><b>禅意模式</b><em id="best-zen">最佳 0</em></div>
            <span>90 秒 · 没有炸弹没有失误 · 纯粹享受切水果</span>
          </button>
        </div>
        <p class="tip small">按住划过水果即切开 · P 暂停 · M 音效 · 总分可来自任何模式<br>
          <button class="miniBtn" id="coverBtn">返回封面</button></p>
      </div>
    </div>
    <div id="levels" class="overlay hidden">
      <div class="panel wide">
        <h2>选择关卡</h2>
        <p class="tip small" style="margin:0">总分越多解锁越多 · 橙色为狂热关(无炸弹·水果更多·得分更高)</p>
        <div class="lvlGrid" id="lvlGrid"></div>
        <div class="row"><button class="btn primary" id="lvlBack">返回</button>
          <button class="btn danger" id="wipeBtn">清零进度</button></div>
      </div>
    </div>
    <div id="equip" class="overlay hidden">
      <div class="panel wide">
        <h2>装备库</h2>
        <div class="resBox" id="resBox"></div>
        <div class="eqCols">
          <div class="eqCol">
            <div class="eqTitle">壁纸 <span id="wpCount"></span></div>
            <div class="eqList" id="wpList"></div>
          </div>
          <div class="eqCol">
            <div class="eqTitle">刀 <span id="blCount"></span></div>
            <div class="eqList" id="blList"></div>
          </div>
        </div>
        <div class="row"><button class="btn primary" id="eqBack">返回</button></div>
      </div>
    </div>
    <div id="over" class="overlay hidden">
      <div class="panel">
        <h2 id="overTitle">游戏结束</h2>
        <div class="stats">
          <div class="stat"><div class="n" id="fScore">0</div><div class="l">本局分数</div></div>
          <div class="stat"><div class="n" id="fBest">0</div><div class="l">总分</div></div>
          <div class="stat"><div class="n" id="fCombo">0</div><div class="l">最高连击</div></div>
        </div>
        <div id="newBest" style="display:none">★ 新纪录!★</div>
        <div id="unlockInfo"></div>
        <div class="row">
          <button class="btn primary" id="againBtn">再来一局</button>
          <button class="btn" id="menuBtn">返回菜单</button>
        </div>
      </div>
    </div>
    <div id="paused" class="overlay hidden">
      <div class="panel">
        <h2>暂停中</h2>
        <div class="row">
          <button class="btn primary" id="resumeBtn">继续</button>
          <button class="btn" id="restartBtn">重新开始</button>
          <button class="btn" id="menuBtn2">菜单</button>
        </div>
      </div>
    </div>
  </div>
<script>
(function(){
'use strict';
window.__qsgErrors=window.__qsgErrors||[];
window.addEventListener('error',function(e){window.__qsgErrors.push(e.message+' @'+(e.lineno||0));});

var TAU=Math.PI*2;
function clamp(v,a,b){return v<a?a:v>b?b:v}
function rand(a,b){return a+Math.random()*(b-a)}
function rint(a,b){return Math.floor(rand(a,b+1))}

/* ================= 存档 ================= */
var SAVE_KEY='qsg_save_v2';
var save={total:0,best:{arcade:0,zen:0},lvlBest:[],wp:-1,blade:-1,snd:1,music:1};
try{
  var _s=JSON.parse(localStorage.getItem(SAVE_KEY));
  if(_s)save=Object.assign(save,_s);
}catch(e){}
if(!save.lvlBest)save.lvlBest=[];
if(typeof save.music!=='number')save.music=1;
try{ // 迁移 v1
  var _o=JSON.parse(localStorage.getItem('qsg_save_v1'));
  if(_o){if(_o.best){save.best.arcade=Math.max(save.best.arcade||0,_o.best.arcade||0);
    save.best.zen=Math.max(save.best.zen||0,_o.best.zen||0)}
    if(typeof _o.snd==='number')save.snd=_o.snd}
}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}
function levelFromScore(t){return Math.min(100,Math.floor(t/100)+1)}
function maxLevel(){return levelFromScore(save.total)}
function wpUnlockedCount(){return Math.min(50,Math.floor(maxLevel()/2))}

/* ================= DOM ================= */
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');

function vgrad(g,y0,y1,stops){
  var gr=g.createLinearGradient(0,y0,0,y1);
  for(var i=0;i<stops.length;i++)gr.addColorStop(stops[i][0],stops[i][1]);
  return gr;
}
function drawStars(g,n,seedBase,alpha){
  for(var i=0;i<n;i++){
    var x=((i*97+seedBase*53)%W),y=((i*61+seedBase*37)%(H*.75));
    g.globalAlpha=alpha*(.4+((i*31)%10)/14);
    g.fillStyle='#fff';
    g.beginPath();g.arc(x,y,((i*13)%10)/8*u+.6,0,TAU);g.fill();
  }
  g.globalAlpha=1;
}
/* —— 通用绘制辅助(照片感) —— */
function nz(i,s){var n=Math.sin(i*127.1+s*311.7)*43758.5453;return n-Math.floor(n)}
function fog(g,y0,y1,c0,c1){
  var gr=g.createLinearGradient(0,y0,0,y1);
  gr.addColorStop(0,c0);gr.addColorStop(1,c1);
  g.fillStyle=gr;g.fillRect(0,y0,W,y1-y0);
}
function lightShaft(g,x,w,alpha,ang){
  g.save();g.translate(x,0);g.rotate(ang||.16);
  var gr=g.createLinearGradient(0,0,0,H*1.05);
  gr.addColorStop(0,'rgba(255,250,215,'+alpha+')');gr.addColorStop(.75,'rgba(255,250,215,0)');
  g.fillStyle=gr;
  g.beginPath();g.moveTo(-w*.5,0);g.lineTo(w*.5,0);
  g.lineTo(w*1.6,H*1.05);g.lineTo(-w*1.2,H*1.05);g.closePath();g.fill();
  g.restore();
}
function paperNoise(g,n,alpha,col){
  g.fillStyle=col||'rgba(120,100,70,1)';
  for(var i=0;i<n;i++){
    g.globalAlpha=alpha*nz(i,91);
    g.fillRect(nz(i,92)*W,nz(i,93)*H,1.6,1.6);
  }
  g.globalAlpha=1;
}

function pickFruit(){
  var s=0,i;for(i=0;i<FR_W.length;i++)s+=FR_W[i];
  var t=Math.random()*s;

var coverEl=document.getElementById('cover');
function cspr(g,spr,x,y,R,rot){
  var s=R/SPR_R,sz=SPR_SIZE*s;
  g.save();g.translate(x,y);if(rot)g.rotate(rot);
  g.drawImage(spr,-sz/2,-sz/2,sz,sz);g.restore();
}
function chalf(g,spr,x,y,R,rot,dir,sq){
  var s=R/SPR_R,sz=SPR_SIZE*s,hs=sz/2,B=hs*1.3;
  g.save();g.translate(x,y);g.rotate(rot);g.scale(1,sq||.8);
  g.beginPath();g.rect(-B,dir<0?-B:0,B*2,B);g.clip();
  g.drawImage(spr,-hs,-hs,sz,sz);g.restore();
}
function cstar(g,x,y,R,col){
  g.fillStyle=col;g.save();g.translate(x,y);
  g.beginPath();g.moveTo(0,-R);g.quadraticCurveTo(0,0,R,0);g.quadraticCurveTo(0,0,0,R);
  g.quadraticCurveTo(0,0,-R,0);g.quadraticCurveTo(0,0,0,-R);g.closePath();g.fill();g.restore();
}

  for(i=0;i<10;i++){
    a=rand(0,TAU);
    addPart({x:f.x,y:f.y,vx:Math.cos(a)*rand(20,90)*u,vy:Math.sin(a)*rand(20,90)*u-40*u,
      r:rand(7,14)*u,col:'rgba(90,90,100,.5)',life:rand(.5,.8),grav:-.06});
  }
  var near=fruits.slice();
  for(i=0;i<near.length;i++){
    var o=near[i];
    if(o!==f&&Math.abs(o.x-f.x)<260*u&&Math.abs(o.y-f.y)<260*u){
      removeFruit(o);
      if(o.kind==='bomb')continue;
      spawnHalves(o,rand(0,TAU),ART[o.kind]);
      juice(o,rand(0,TAU),ART[o.kind].juice);
    }
  }
  removeFruit(f);
  if(phase==='play'){
    if(mode==='arcade'){score=Math.max(0,score-10);updateScore();addPop(f.x,f.y-40,'-10','#ff6a4a',24)}
    else{
      if(M.shieldBomb&&!shieldBombUsed){
        shieldBombUsed=true;
        addPop(f.x,f.y-40,'刀盾护体!','#9ad0ff',26,1.1);
        sfx.shield();
      }else{
        addPop(f.x,f.y-40,'炸弹!','#ff5a4a',26);
        loseLife();
      }
    }
  }
}
function applyPower(p){
  var d=M.bananaDur;
  if(p==='freeze')freezeT=4.2*d;
  else if(p==='frenzy'){frenzyT=4.5*d;frenzySpawnT=0}
  else doubleT=8*d;
  addPop(W/2,H*.22,POWNAME[p],p==='freeze'?'#9ad4ff':p==='frenzy'?'#ffb05e':'#ffe14d',34,1.3,true);
}
function loseLife(){
  if(phase!=='play')return;
  lives--;updateLives();sfx.life();
  if(lives<=0)endGame(mode==='arcade'||mode==='zen'?'时间到!':'游戏结束');
}
/* ================= 更新 ================= */
function update(dt){
  elapsed+=dt;
  var ts=freezeT>0?.32:1,sdt=dt*ts;
  if(phase==='play'){
    if(runCfg.time){
      timeLeft-=dt;
      var s=Math.ceil(timeLeft);
      if(s<=5&&s>=1&&s!==lastTickSec){lastTickSec=s;sfx.tick()}
      syncTimer();
      if(timeLeft<=0){endGame('时间到!');return}
    }
    if(freezeT>0)freezeT-=dt;
    if(frenzyT>0)frenzyT-=dt;
    if(doubleT>0)doubleT-=dt;
    mult=doubleT>0?2:1;
    if(frenzyT>0){
      frenzySpawnT-=sdt;
      if(frenzySpawnT<=0){frenzySpawnT=.18;launch(pickFruit())}
    }else{
      spawnT-=sdt;
      if(spawnT<=0){
        spawnT=Math.max(runCfg.intervalMin,runCfg.intervalK-elapsed*.012)*rand(.8,1.2);
        spawnWave();
      }
    }
    if(mode==='arcade'){
      powerT-=dt;
      if(powerT<=0){powerT=rand(11,16);launch('banana',{power:['freeze','frenzy','double'][rint(0,2)]})}
    }
    if(comboT>0){
      comboT-=dt;
      if(comboT<=0){
        if(comboN>=3){
          var bonus=Math.round((comboN+M.comboAdd)*M.comboBonusMul*runCfg.scoreMul*M.score)*1;
          score+=bonus;updateScore();
          addPop(lastSliceX,clamp(lastSliceY-50,60,H-60),comboN+'连击 +'+bonus,'#ffe14d',26,1.1);
          sfx.combo(comboN);
        }
        comboN=0;syncCombo();
      }
    }
  }
  if(phase==='menu'){
    spawnT-=dt;
    if(spawnT<=0){
      spawnT=rand(.9,1.5);
      launch(pickFruit());
      if(Math.random()<.3)launch(pickFruit());
    }
  }
  for(var i=pending.length-1;i>=0;i--){
    pending[i].t-=sdt;
    if(pending[i].t<=0){launch(pending[i].kind);pending.splice(i,1)}
  }
  for(i=fruits.length-1;i>=0;i--){
    var f=fruits[i];
    f.age+=sdt;f.vy+=G()*sdt;f.x+=f.vx*sdt;f.y+=f.vy*sdt;f.rot+=f.vr*sdt;
    if(phase==='menu'&&f.age>f.doom){
      fruits.splice(i,1);
      sliceFruit(f,rand(0,TAU),true,true);
      continue;
    }
    if(f.y>H+f.r*2.4&&f.vy>0){
      fruits.splice(i,1);
      if(phase==='play'&&mode==='level'&&!f.noPen&&f.kind!=='bomb'&&f.kind!=='banana'){
        if(M.shieldMiss&&!shieldMissUsed){
          shieldMissUsed=true;
          addPop(clamp(f.x,40,W-40),H-70,'慈悲庇护!','#9ad0ff',22,1);
          sfx.shield();
        }else{
          addPop(clamp(f.x,40,W-40),H-70,'漏接!','#9ad0ff',20);
          loseLife();
        }
      }
    }
  }
  for(i=halves.length-1;i>=0;i--){
    var h=halves[i];
    h.life-=dt;h.vy+=1500*u*.9*dt;h.x+=h.vx*dt;h.y+=h.vy*dt;h.rot+=h.vr*dt;
    if(h.sq>.5)h.sq-=dt*.8;
    if(h.life<=0||h.y>H+160)halves.splice(i,1);
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.life-=dt;p.vy+=1500*u*dt*(p.grav!=null?p.grav:1);p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.life<=0)parts.splice(i,1);
  }
  for(i=rings.length-1;i>=0;i--){
    rings[i].life-=dt;rings[i].r+=rings[i].v*dt;
    if(rings[i].life<=0)rings.splice(i,1);
  }
  for(i=pops.length-1;i>=0;i--){
    pops[i].life-=dt;
    if(!pops[i].noRise)pops[i].y-=30*dt;
    if(pops[i].life<=0)pops.splice(i,1);
  }
  if(flashT>0)flashT-=dt;
  if(shakeT>0)shakeT-=dt;
  if(phase!=='paused'){
    stainX.save();
    stainX.setTransform(1,0,0,1,0,0);
    stainX.globalCompositeOperation='destination-out';
    stainX.fillStyle='rgba(0,0,0,'+(0.4*dt)+')';
    stainX.fillRect(0,0,stainC.width,stainC.height);
    stainX.restore();
  }
}
/* ================= 渲染 ================= */
function drawFruit(f,now){
  var art=ART[f.kind],s=f.r/SPR_R,sz=SPR_SIZE*s;
  if(f.kind==='gold'){
    var ga=.35+.15*Math.sin(now/150);
    aura(f.x,f.y,f.r*2.1,'rgba(255,220,110,'+ga+')');
  }else if(f.kind==='banana'){
    var col=POWCOL[f.power]||POWCOL.double;
    aura(f.x,f.y,f.r*2.0,col+(.3+.12*Math.sin(now/130))+')');
  }
  ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);
  ctx.drawImage(art.whole,-sz/2,-sz/2,sz,sz);
  ctx.restore();
  if(f.kind==='bomb')drawSpark(f,now);
}
function aura(x,y,r,col){
  var g=ctx.createRadialGradient(x,y,r*.2,x,y,r);
  g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
}
function drawSpark(f,now){
  var c=ART.bomb.fuse;
  var lx=c[0]*f.r,ly=c[1]*f.r;
  var cs=Math.cos(f.rot),sn=Math.sin(f.rot);
  var x=f.x+lx*cs-ly*sn,y=f.y+lx*sn+ly*cs;
  var fl=.7+.3*Math.sin(now/40+Math.random()*2);
  aura(x,y,14*u*fl,'rgba(255,180,60,.8)');
  ctx.fillStyle='#fff2c0';
  ctx.beginPath();ctx.arc(x,y,2.6*u,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(255,220,120,.8)';ctx.lineWidth=1.4;
  for(var i=0;i<4;i++){
    var a=rand(0,TAU),l=rand(4,9)*u;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);ctx.stroke();
  }
}
function drawHalf(h){
  var s=h.r/SPR_R,sz=SPR_SIZE*s,hs=sz/2,B=hs*1.25;
  ctx.save();
  ctx.translate(h.x,h.y);ctx.rotate(h.rot);ctx.scale(1,h.sq);
  ctx.beginPath();ctx.rect(-B,h.dir<0?-B:0,B*2,B);ctx.clip();
  ctx.globalAlpha=clamp(h.life*2.2,0,1);
  ctx.drawImage(h.spr,-hs,-hs,sz,sz);
  ctx.restore();
}
/* 刀光样式:风格决定颜色,阶位决定宽度与光粒 */
function bladeStyle(){
  if(save.blade<0)return{color:'#ffffff',rainbow:false,width:1,glow:false,i:-1};
  var b=BLADES[save.blade];
  return{color:BL_COLORS[b.style],rainbow:b.style===7,width:1+.12*(b.tier-1),glow:b.tier>=3,i:b.style};
}
function mixWhite(rgb,k){
  var p=rgb.split(','),o=[];
  for(var i=0;i<3;i++)o.push(Math.round(p[i]*(1-k)+255*k));
  return o.join(',');
}
function drawTrail(now){
  while(trail.length&&now-trail[0].t>150)trail.shift();
  if(trail.length<2)return;
  var st=bladeStyle(),wu=Math.max(.8,u);
  var rgb=hexRGB(st.color),core=mixWhite(rgb,.6);
  var passes=[[24,.10],[14,.22],[7,.5],[2.8,.95]];
  ctx.lineCap='round';ctx.lineJoin='round';
  // 深色衬底: 浅色壁纸上刀光也清晰
  ctx.strokeStyle='rgba(35,25,50,.18)';
  for(var d0=1;d0<trail.length;d0++){
    var a0=trail[d0-1],b0=trail[d0],k0=1-(now-b0.t)/150;
    if(k0<=0)continue;
    ctx.lineWidth=27*wu*st.width*(.22+.78*k0);
    ctx.beginPath();ctx.moveTo(a0.x,a0.y);ctx.lineTo(b0.x,b0.y);ctx.stroke();
  }
  for(var p=0;p<4;p++){
    for(var i=1;i<trail.length;i++){
      var a=trail[i-1],b=trail[i];
      var k=1-(now-b.t)/150;
      if(k<=0)continue;
      ctx.strokeStyle=st.rainbow
        ?'hsla('+((now/4+b.x)%360)+',95%,'+(p===3?85:70)+'%,'+passes[p][1]+')'
        :'rgba('+(p<3?rgb:core)+','+passes[p][1]+')';
      ctx.lineWidth=passes[p][0]*wu*st.width*(.22+.78*k);
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    }
  }
  var h2=trail[trail.length-1];
  var hg=ctx.createRadialGradient(h2.x,h2.y,0,h2.x,h2.y,10*wu);
  hg.addColorStop(0,'rgba(255,255,255,.9)');hg.addColorStop(.4,'rgba('+core+',.4)');hg.addColorStop(1,'rgba('+core+',0)');
  ctx.fillStyle=hg;ctx.beginPath();ctx.arc(h2.x,h2.y,10*wu,0,TAU);ctx.fill();
  var prev=trail.length>1?trail[trail.length-2]:h2;
  var ang2=Math.atan2(h2.y-prev.y,h2.x-prev.x);
  ctx.save();ctx.translate(h2.x,h2.y);ctx.rotate(ang2);
  var cg=ctx.createRadialGradient(2*wu,0,0,2*wu,0,17*wu);
  cg.addColorStop(0,'rgba('+core+',.5)');cg.addColorStop(1,'rgba('+core+',0)');
  ctx.fillStyle=cg;
  ctx.beginPath();ctx.ellipse(4*wu,0,17*wu,6*wu,0,0,TAU);ctx.fill();
  ctx.restore();
  if(st.glow&&Math.random()<.6){
    addPart({x:h2.x+rand(-6,6),y:h2.y+rand(-6,6),vx:rand(-40,40),vy:rand(-40,40),
      r:rand(1,2.4)*u,col:st.rainbow?'hsl('+((now/4)%360)+',95%,75%)':st.color,life:.3,grav:.1});
  }
}
function hexRGB(hex){
  var n=parseInt(hex.slice(1),16);
  return((n>>16)&255)+','+((n>>8)&255)+','+(n&255);
}
/* 洞察轨迹线 */
function drawInsight(){
  if(M.insight<=0||phase==='menu')return;
  var T=.4+.18*M.insight,g=G();
  ctx.setLineDash([4*u,7*u]);
  ctx.strokeStyle='rgba(255,255,255,'+(0.10+0.045*M.insight)+')';
  ctx.lineWidth=1.5;
  for(var i=0;i<fruits.length;i++){
    var f=fruits[i],x=f.x,y=f.y,vx=f.vx,vy=f.vy;
    ctx.beginPath();ctx.moveTo(x,y);
    for(var s=0;s<8;s++){
      var dt=T/8;
      x+=vx*dt;vy+=g*dt;y+=vy*dt;
      ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.setLineDash([]);
}
function drawCoin(p){
  ctx.save();ctx.translate(p.x,p.y);
  var sq=Math.abs(Math.sin(p.life*9))*.7+.3;
  ctx.scale(sq,1);
  ctx.fillStyle='#ffd233';ctx.beginPath();ctx.arc(0,0,p.r,0,TAU);ctx.fill();
  ctx.strokeStyle='#b8860b';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(-p.r*.3,-p.r*.3,p.r*.28,0,TAU);ctx.fill();
  ctx.restore();
}
function tint(col){
  var g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.32,W/2,H/2,Math.max(W,H)*.72);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,col);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function render(){
  var now=performance.now();
  ctx.drawImage(bgC,0,0,W,H);
  ctx.save();
  if(shakeT>0){
    var m=shakeMag*(shakeT/.5);
    ctx.translate(rand(-m,m),rand(-m,m));
  }
  ctx.drawImage(stainC,0,0,W,H);
  var i;
  drawInsight();
  for(i=0;i<fruits.length;i++)drawFruit(fruits[i],now);
  for(i=0;i<halves.length;i++)drawHalf(halves[i]);
  for(i=0;i<parts.length;i++){
    var p=parts[i];
    ctx.globalAlpha=clamp(p.life*2.2,0,1);
    if(p.coin)drawCoin(p);
    else{
      ctx.fillStyle=p.col;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  for(i=0;i<rings.length;i++){
    var r=rings[i],rk=r.life/r.max;
    ctx.globalAlpha=rk*.8;
    ctx.strokeStyle='rgba(255,200,120,1)';
    ctx.lineWidth=8*u*rk;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke();
  }
  ctx.globalAlpha=1;
  drawTrail(now);
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(i=0;i<pops.length;i++){
    var q=pops[i];
    ctx.globalAlpha=clamp(q.life/q.max*1.6,0,1);
    ctx.font='900 '+q.size+'px "Microsoft YaHei",sans-serif';
    ctx.strokeStyle='rgba(40,20,5,.85)';
    ctx.lineWidth=Math.max(3,q.size*.13);
    ctx.strokeText(q.text,q.x,q.y);
    ctx.fillStyle=q.col;
    ctx.fillText(q.text,q.x,q.y);
  }
  ctx.globalAlpha=1;
  if(phase==='play'){
    if(freezeT>0)tint(POWCOL.freeze+(.2*Math.min(1,freezeT))+')');
    if(frenzyT>0)tint(POWCOL.frenzy+(.15*Math.min(1,frenzyT))+')');
    if(doubleT>0)tint(POWCOL.double+(.12*Math.min(1,doubleT/2))+')');
  }
  ctx.restore();
  if(flashT>0){
    ctx.fillStyle='rgba(255,240,210,'+(flashT/.3*.75)+')';
    ctx.fillRect(0,0,W,H);
  }
}
/* ================= 主循环 ================= */
var lastT=performance.now();
function frame(now){
  var dt=Math.min(.033,(now-lastT)/1000);
  lastT=now;
  if(phase==='play'||phase==='menu')update(dt);
  else if(phase==='count'){updateCount(dt);update(dt)}
  render();
  requestAnimationFrame(frame);
}
/* ================= HUD 与流程 ================= */
function updateScore(){scoreV.textContent=score}
function updateLives(){
  var n=runCfg?runCfg.lives:3,s='';
  for(var i=0;i<n;i++)s+='<span class="'+(i<lives?'ok':'lost')+'">'+(i<lives?'❤':'✕')+'</span>';
  livesV.innerHTML=s;
}
function syncCombo(){
  var show=phase==='play'&&comboN>=2;
  comboB.style.display=show?'':'none';
  if(show)comboV.textContent='×'+comboN;
}
function syncTimer(){

  var s=Math.max(0,Math.ceil(timeLeft));
  if(s!==lastTimerShown){
    lastTimerShown=s;
    timeV.textContent=s;
    timeV.className='val'+(s<=10?' low':'');
  }
}
function syncFxBar(){
  var bar=document.getElementById('fxBar'),h='';

    var w=WPS[save.wp];

  }

function refreshMenuProgress(){

    ?'已全部解锁!100 关 · 50 壁纸 · 50 刀'

function reset(){
  score=0;lives=runCfg.lives;elapsed=0;mult=1;
  comboN=0;comboT=0;bestCombo=0;
  freezeT=frenzyT=doubleT=flashT=shakeT=0;
  timeLeft=runCfg.time?runCfg.time+M.timeAdd:0;
  spawnT=1.2;powerT=7;lastTickSec=-1;
  fruits=[];halves=[];parts=[];pops=[];rings=[];pending=[];trail=[];
  shieldMissUsed=false;shieldBombUsed=false;slicedCount=0;coinsGot=0;
  stainX.setTransform(1,0,0,1,0,0);
  stainX.clearRect(0,0,stainC.width,stainC.height);
  updateScore();updateLives();syncCombo();
}
function beginRun(){
  M=mods();
  reset();
  syncFxBar();
  if(M.res&&save.wp>=0)
    addPop(W/2,H*.3,'共鸣·'+ELEMENTS[M.resEl]+' 发动!',EL_COLORS[M.resEl],30,1.6,true);
  phase='count';countT=3.3;
  menuEl.classList.add('hidden');overEl.classList.add('hidden');pausedEl.classList.add('hidden');
  levelsEl.classList.add('hidden');equipEl.classList.add('hidden');

    levelBox.style.display='';

    levelV.className='val'+(runCfg.frenzy?' hot':'');

function startGame(m){
  mode=m;runCfg=modeCfg(m);
  beginRun();
}
function startLevel(n){
  curLevel=n;mode='level';runCfg=levelCfg(n);
  beginRun();
}
function toMenu(){
  phase='menu';
  overEl.classList.add('hidden');pausedEl.classList.add('hidden');
  levelsEl.classList.add('hidden');equipEl.classList.add('hidden');
  menuEl.classList.remove('hidden');countEl.classList.add('hidden');
  fruits=[];halves=[];parts=[];pops=[];rings=[];pending=[];trail=[];
  spawnT=.5;score=0;updateScore();
  livesBox.style.display='none';timerBox.style.display='none';
  levelBox.style.display='none';syncCombo();
  syncFxBar();
  refreshMenuProgress();

function bankRun(){
  var oldLevel=levelFromScore(save.total);
  save.total+=score;
  if(mode==='arcade'&&score>(save.best.arcade||0))save.best.arcade=score;
  if(mode==='zen'&&score>(save.best.zen||0))save.best.zen=score;
  if(mode==='level'){
    if(!save.lvlBest[curLevel-1]||score>save.lvlBest[curLevel-1])save.lvlBest[curLevel-1]=score;
  }
  var newLevel=levelFromScore(save.total);
  persist();
  return{oldLevel:oldLevel,newLevel:newLevel};
}
function endGame(title){
  if(phase==='over')return;
  phase='over';trail=[];
  var oldArc=save.best.arcade||0,oldZen=save.best.zen||0;
  var lv=bankRun(),oldLevel=lv.oldLevel,newLevel=lv.newLevel;
  var isNew=(mode==='arcade'&&score>oldArc)||(mode==='zen'&&score>oldZen);
  var unlockHTML='';
  if(newLevel>oldLevel){
    var items=[];
    for(var L=oldLevel+1;L<=newLevel;L++){
      if(L%2===0){
        var idx=L/2-1;
        if(idx<50){
          items.push('壁纸「'+WPS[idx].name+'」');
          items.push('刀「'+BLADES[idx].name+'」');
        }
      }
    }
    unlockHTML='升级到第 '+newLevel+' 关!<br>'+items.join(' · ');
    sfx.unlock();
  }
  document.getElementById('overTitle').textContent=title;
  document.getElementById('fScore').textContent=score;
  document.getElementById('fBest').textContent=save.total;
  document.getElementById('fCombo').textContent=bestCombo;
  document.getElementById('newBest').style.display=isNew?'':'none';
  var ui=document.getElementById('unlockInfo');
  ui.style.display=unlockHTML?'':'none';
  ui.innerHTML=unlockHTML;
  overEl.classList.remove('hidden');
  countEl.classList.add('hidden');
  sfx.over();
}
var pauseFrom='play';
function setPause(on){
  if(on&&(phase==='play'||phase==='count')){
    pauseFrom=phase;
    phase='paused';pausedEl.classList.remove('hidden');trail=[];
  }else if(!on&&phase==='paused'){
    phase=pauseFrom;pausedEl.classList.add('hidden');lastT=performance.now();
  }
}
function updateCount(dt){
  countT-=dt;
  var lbl=countT>2.2?'3':countT>1.2?'2':countT>.25?'1':'开切!';
  if(lbl!==countEl.textContent){
    countEl.textContent=lbl;
    countEl.classList.remove('pop');void countEl.offsetWidth;
    countEl.classList.add('pop');
    if(lbl==='开切!')sfx.go();else sfx.tick();
  }
  if(countT<=0){
    countEl.classList.add('hidden');
    phase='play';spawnT=.3;elapsed=0;
  }
}
/* ================= 关卡选择 ================= */
function buildLevelGrid(){
  var grid=document.getElementById('lvlGrid');
  grid.innerHTML='';
  var lv=maxLevel();
  for(var n=1;n<=100;n++){
    (function(n){
      var unlocked=save.total>=(n-1)*100;
      var b=document.createElement('button');
      b.className='lvlBtn'+(n%10===0?' frenzy':'')+(unlocked?'':' locked');
      if(unlocked&&save.lvlBest[n-1])b.classList.add('done');
      if(n===lv)b.classList.add('cur');
      b.textContent=unlocked?n:'🔒';
      b.title=unlocked?('第 '+n+' 关'+(n%10===0?' · 狂热关':'')+(save.lvlBest[n-1]?' · 最佳 '+save.lvlBest[n-1]:''))
        :'需要总分 '+(n-1)*100+' 解锁';
      if(unlocked)b.addEventListener('click',function(){audio();startLevel(n)});
      grid.appendChild(b);
    })(n);
  }
}
/* ================= 装备库 ================= */
/* —— 换装演示: 用新刀光在画面上挥一刀 —— */
function demoSlash(){
  var y=H*rand(.3,.55),dir=Math.random()<.5?1:-1;
  var x0=dir>0?W*.18:W*.82,x1=dir>0?W*.82:W*.18;
  var n=8,i=0;
  var iv=setInterval(function(){
    i++;
    var t=i/n;
    trail.push({x:x0+(x1-x0)*t,y:y+Math.sin(t*Math.PI)*-36,t:performance.now()});
    if(trail.length>40)trail.shift();
    if(i>=n)clearInterval(iv);
  },16);
}
/* —— 装备预览小图 —— */
var TH_SWATCH=[['#2a4d22','#0e200d'],['#1c2a52','#070d1f'],['#ffe4ec','#e893ae'],['#ffedbe','#c9863f'],
  ['#eaf6ff','#8fc0e0'],['#2a120a','#0a0302'],['#1a0e36','#080414'],['#efeadd','#c8bda2'],
  ['#0c0c1c','#050508'],['#573419','#301e0d']];
function paintBladePrev(c,item){
  var g=c.getContext('2d'),w=c.width,h=c.height;
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,w,h);
  g.lineCap='round';
  var rainbow=!item.white&&item.style===7;
  var rgb=item.white?'255,255,255':(rainbow?'255,255,255':hexRGB(BL_COLORS[item.style]));
  var passes=[[9,.22],[5,.55],[2,.95]];
  for(var p=0;p<3;p++){
    for(var i=1;i<=8;i++){
      var t0=(i-1)/8,t1=i/8;
      var x0=6+t0*(w-12),x1=6+t1*(w-12);
      var y0=h/2+(1-t0)*3-1.5,y1=h/2+(1-t1)*3-1.5;
      g.strokeStyle=rainbow
        ?'hsla('+Math.round((t1*300+item.i*13)%360)+',95%,72%,'+passes[p][1]+')'
        :'rgba('+rgb+','+passes[p][1]+')';
      g.lineWidth=Math.max(1,passes[p][0]*(.3+.7*t1)*(1+.1*(item.tier-1)));
      g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();
    }
  }
}
function paintWpPrev(c,item){
  var g=c.getContext('2d'),w=c.width,h=c.height;
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,w,h);
  var sw=TH_SWATCH[item.theme];
  var gr=g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,sw[0]);gr.addColorStop(1,sw[1]);
  g.fillStyle=gr;
  if(g.roundRect){g.beginPath();g.roundRect(1,1,w-2,h-2,5);g.fill()}
  else g.fillRect(1,1,w-2,h-2);
  g.strokeStyle='rgba(90,58,22,.6)';g.lineWidth=1.5;
  if(g.roundRect){g.beginPath();g.roundRect(1,1,w-2,h-2,5);g.stroke()}
  if(item.el>=0){
    g.fillStyle=EL_COLORS[item.el];
    g.beginPath();g.arc(w-9,9,3.4,0,TAU);g.fill();
  }
}
function eqItemHTML(item,isWP,unlocked){
  var elc=item.el>=0?'<i class="elc" style="background:'+EL_COLORS[item.el]+'">'+ELEMENTS[item.el]+'</i>':'';
  var prev=isWP
    ?'<canvas class="wpPrev" width="76" height="44" data-i="'+item.i+'"></canvas>'
    :'<canvas class="blPrev" width="150" height="32" data-i="'+item.i+'"></canvas>';
  if(!unlocked)return'<div class="eqItem locked"><div class="erow"><b>'+item.name+'</b>'+prev+elc+'</div><span>第 '+item.unlockLevel+' 关解锁</span></div>';
  return'<div class="eqItem'+((isWP?save.wp:save.blade)===item.i?' equipped':'')+'" data-i="'+item.i+'">'+
    '<div class="erow"><b>'+item.name+'</b>'+prev+elc+'</div>'+
    '<span>'+item.typeName+':'+item.desc+'</span></div>';
}
function buildEquipLists(){
  var wn=wpUnlockedCount();
  var wl=document.getElementById('wpList'),bl=document.getElementById('blList');
  var whtml='<div class="eqItem'+(save.wp<0?' equipped':'')+'" data-i="-1"><div class="erow"><b>初始·道场</b><canvas class="wpPrev" width="76" height="44" data-i="-1"></canvas></div><span>古朴木纹,无特殊效果</span></div>';
  var bhtml='<div class="eqItem'+(save.blade<0?' equipped':'')+'" data-i="-1"><div class="erow"><b>初始·白刃</b><canvas class="blPrev" width="150" height="32" data-i="-1"></canvas></div><span>朴素白光,无特殊效果</span></div>';
  for(var i=0;i<50;i++){
    whtml+=eqItemHTML(WPS[i],true,i<wn);
    bhtml+=eqItemHTML(BLADES[i],false,i<wn);
  }
  wl.innerHTML=whtml;bl.innerHTML=bhtml;
  document.getElementById('wpCount').textContent='已解锁 '+wn+' / 51';
  document.getElementById('blCount').textContent='已解锁 '+wn+' / 51';
  Array.prototype.forEach.call(wl.querySelectorAll('.wpPrev'),function(c){
    var i=parseInt(c.getAttribute('data-i'),10);
    paintWpPrev(c,i>=0?WPS[i]:{theme:9,el:-1});
  });
  Array.prototype.forEach.call(bl.querySelectorAll('.blPrev'),function(c){
    var i=parseInt(c.getAttribute('data-i'),10);
    paintBladePrev(c,i>=0?BLADES[i]:{style:0,i:-1,tier:1,white:true});
  });
  Array.prototype.forEach.call(wl.querySelectorAll('.eqItem:not(.locked)'),function(el){
    el.addEventListener('click',function(){equipWP(parseInt(el.getAttribute('data-i'),10))});
  });
  Array.prototype.forEach.call(bl.querySelectorAll('.eqItem:not(.locked)'),function(el){
    el.addEventListener('click',function(){equipBlade(parseInt(el.getAttribute('data-i'),10))});
  });
  refreshResBox();
}
function refreshResBox(){
  syncFxBar();
  var box=document.getElementById('resBox');
  var w=save.wp>=0?WPS[save.wp]:null,b=save.blade>=0?BLADES[save.blade]:null;
  if(w&&b&&w.el===b.el){
    box.className='resBox on';
    box.innerHTML='共鸣·'+ELEMENTS[w.el]+' <span style="color:'+EL_COLORS[w.el]+'">●</span> — '+RES_DESC[w.el]+
      '<br><small>壁纸「'+w.name+'」与刀「'+b.name+'」同源,配合技已激活!</small>';
  }else{
    box.className='resBox';
    box.innerHTML='共鸣:未激活 — 装备<b>同元素</b>的壁纸与刀可触发配合技'+
      (w&&b?'(当前:'+ELEMENTS[w.el]+' × '+ELEMENTS[b.el]+')':'');
  }
}
function equipWP(i){
  var oldRes=M.res;
  save.wp=i;persist();
  M=mods();drawBG();
  buildEquipLists();
  if(i>=0)sfx.equipWP(WPS[i].el);else sfx.equipWP(0);
  if(M.res&&!oldRes)sfx.resonance();
  demoSlash();
  refreshResBox();
}
function equipBlade(i){
  var oldRes=M.res;
  save.blade=i;persist();
  M=mods();
  buildEquipLists();
  if(i>=0)sfx.equipBlade(BLADES[i].el);else sfx.equipBlade(0);
  if(M.res&&!oldRes)sfx.resonance();
  demoSlash();
  refreshResBox();
}
/* ================= 输入 ================= */
var armed=false,pointerId=null,lastPt=null,lastSwooshT=0;
function ptOf(e){
  var r=cv.getBoundingClientRect();
  return{x:e.clientX-r.left,y:e.clientY-r.top};
}
cv.addEventListener('pointerdown',function(e){
  audio();
  if(phase==='over'||phase==='paused')return;
  e.preventDefault();
  armed=true;pointerId=e.pointerId;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  var p=ptOf(e);
  trail.push({x:p.x,y:p.y,t:performance.now()});
  lastPt=p;
});
cv.addEventListener('pointermove',function(e){
  if(!armed||e.pointerId!==pointerId)return;
  var p=ptOf(e),now=performance.now();
  var d=Math.hypot(p.x-lastPt.x,p.y-lastPt.y);
  if(d>1){
    trail.push({x:p.x,y:p.y,t:now});
    if(trail.length>48)trail.shift();
    if(d>4)tryCut(lastPt,p);
    if(d>30*u){
      var bst=bladeStyle();
      addPart({x:(p.x+lastPt.x)/2,y:(p.y+lastPt.y)/2,vx:rand(-30,30),vy:rand(-30,30),
        r:rand(1,2)*u,col:bst.rainbow?'#fff':(bst.i>=0?BL_COLORS[bst.i]:'#fff'),life:.25,grav:0});
    }
    if(d>26*u&&now-lastSwooshT>170){lastSwooshT=now;sfx.swoosh()}
    lastPt=p;
  }
});
function endPointer(e){
  if(e.pointerId===pointerId){armed=false;pointerId=null}
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',endPointer);
cv.addEventListener('contextmenu',function(e){e.preventDefault()});
document.addEventListener('keydown',function(e){
  if(!coverEl.classList.contains('hidden')){dismissCover();return}
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){
    if(phase==='play'||phase==='count')setPause(true);
    else if(phase==='paused')setPause(false);
  }else if(e.key==='m'||e.key==='M')toggleSnd();
  else if(e.key==='n'||e.key==='N'){audio();toggleMusic()}
  else if(e.key==='Enter'&&phase==='over'){
    if(mode==='level')startLevel(curLevel);else startGame(mode);
  }
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&phase==='play')setPause(true);
});
function toggleSnd(){
  save.snd=save.snd?0:1;persist();
  if(master)master.gain.value=save.snd?.5:0;
  document.getElementById('sndBtn').textContent=save.snd?'🔊':'🔇';
}
document.getElementById('sndBtn').textContent=save.snd?'🔊':'🔇';
document.getElementById('musBtn').textContent='🎵';
document.getElementById('musBtn').className='iconBtn'+(music.on?'':' off');
document.getElementById('sndBtn').addEventListener('click',function(){audio();toggleSnd()});
document.getElementById('pauseBtn').addEventListener('click',function(){
  if(phase==='play'||phase==='count')setPause(true);
});
document.getElementById('resumeBtn').addEventListener('click',function(){setPause(false)});
document.getElementById('restartBtn').addEventListener('click',function(){

});
document.getElementById('menuBtn2').addEventListener('click',function(){
  if(score>0){
    var lv=bankRun();
    if(lv.newLevel>lv.oldLevel)sfx.unlock();
  }
  toMenu();
  if(score>0)addPop(W/2,H*.3,'已结算 +'+score+' 分','#ffe14d',26,1.6,true);
});
document.getElementById('menuBtn').addEventListener('click',toMenu);
document.getElementById('againBtn').addEventListener('click',function(){
  if(mode==='level')startLevel(curLevel);else startGame(mode);
});
document.getElementById('btnLevels').addEventListener('click',function(){
  audio();buildLevelGrid();
  levelsEl.classList.remove('hidden');menuEl.classList.add('hidden');
});
document.getElementById('lvlBack').addEventListener('click',function(){
  levelsEl.classList.add('hidden');menuEl.classList.remove('hidden');refreshMenuProgress();
});
var wipeArm=0;
document.getElementById('wipeBtn').addEventListener('click',function(){
  var b=this;
  if(Date.now()-wipeArm<3000){
    save.total=0;save.lvlBest=[];save.wp=-1;save.blade=-1;persist();
    M=mods();drawBG();syncFxBar();buildLevelGrid();refreshMenuProgress();
    b.textContent='已清零';b.disabled=true;
    setTimeout(function(){b.textContent='清零进度';b.disabled=false;wipeArm=0},1400);
    sfx.shield();
  }else{
    wipeArm=Date.now();
    b.textContent='再点一次确认清零!';
    setTimeout(function(){
      if(Date.now()-wipeArm>=2900){b.textContent='清零进度';wipeArm=0}
    },3000);

});

});
/* ================= 调试钩子 ================= */
window.__qsg={
  ver:'v2-levels',
  state:function(){return JSON.stringify({phase:phase,mode:mode,level:curLevel,score:score,lives:lives,
    timeLeft:Math.ceil(timeLeft),comboN:comboN,bestCombo:bestCombo,fruits:fruits.length,
    elapsed:Math.round(elapsed),total:save.total,maxLevel:maxLevel(),wp:save.wp,blade:save.blade,
    cover:coverEl.classList.contains('hidden')?0:1,
    res:!!M.res,mods:{score:Math.round(M.score*100),cutR:Math.round(M.cutR*100),crit:Math.round(M.crit*100)}})},
  start:function(m){startGame(m);return window.__qsg.state()},
  startLevel:function(n){startLevel(n);return window.__qsg.state()},
  toMenu:function(){toMenu();return window.__qsg.state()},
  pause:function(){setPause(true);return window.__qsg.state()},
  resume:function(){setPause(false);return window.__qsg.state()},
  fruits:function(){return JSON.stringify(fruits.map(function(f){
    return{k:f.kind,x:Math.round(f.x),y:Math.round(f.y),r:Math.round(f.r),vy:Math.round(f.vy)}}))},
  spawn:function(kind,opts){launch(kind,opts||{});return window.__qsg.state()},
  swipe:function(x1,y1,x2,y2){
    var rect=cv.getBoundingClientRect();
    function fire(type,x,y){
      cv.dispatchEvent(new PointerEvent(type,{clientX:rect.left+x,clientY:rect.top+y,
        bubbles:true,pointerId:9,isPrimary:true,button:0,buttons:1}));
    }
    fire('pointerdown',x1,y1);
    var n=6;
    for(var i=1;i<=n;i++)fire('pointermove',x1+(x2-x1)*i/n,y1+(y2-y1)*i/n);
    fire('pointerup',x2,y2);
    return window.__qsg.state();
  },
  cutAll:function(){
    var hits=fruits.slice();
    hits.forEach(function(f){removeFruit(f);sliceFruit(f,rand(0,TAU),true,false)});
    return window.__qsg.state();
  },
  addTotal:function(n){save.total+=n;persist();return window.__qsg.state()},
  setEquip:function(w,b){save.wp=w;save.blade=b;persist();M=mods();drawBG();syncFxBar();
    return window.__qsg.state()},
  waitCountdown:function(){countT=0;return window.__qsg.state()},
  pump:function(n,dt){
    n=n||1;dt=dt||1/60;
    for(var i=0;i<n;i++){
      if(phase==='count')updateCount(dt);
      if(phase==='play'||phase==='menu')update(dt);
      else break;
    }
    render();
    return window.__qsg.state();
  },
  end:function(){if(phase==='play')endGame('游戏结束');return window.__qsg.state()},
  errors:function(){return JSON.stringify(window.__qsgErrors)},
  mus:function(){return JSON.stringify({on:music.on,step:music.step,ac:!!AC,ctx:AC?AC.state:'none'})},
  save:function(){return JSON.stringify(save)},
  restore:function(s){save=Object.assign({total:0,best:{arcade:0,zen:0},lvlBest:[],wp:-1,blade:-1,snd:1,music:1},JSON.parse(s));persist();M=mods();drawBG();syncFxBar();refreshMenuProgress();return window.__qsg.save()},
  snap:function(name){
    var c=document.createElement('canvas');
    c.width=cv.width;c.height=cv.height;
    c.getContext('2d').drawImage(cv,0,0);
    window.__qsg['snap_'+name]=c.toDataURL('image/png');
    return 'ok:'+name;
  }
};

window.addEventListener('resize',resize);
resize();
drawCover();
setInterval(musicTick,40);
refreshMenuProgress();
syncFxBar();
updateLives();
requestAnimationFrame(frame);
})();
