<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>植物大战僵尸 · 冒险模式</title>
<style>
  html,body{margin:0;height:100%;background:#141f10;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-user-select:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;line-height:0}
  canvas#cv{display:block;border-radius:10px;box-shadow:0 14px 50px rgba(0,0,0,.55);cursor:crosshair}
  #ui{position:absolute;inset:0;pointer-events:none;line-height:1.45;overflow:hidden;border-radius:10px}
  .panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(14,30,10,.66);backdrop-filter:blur(3px);pointer-events:auto;overflow:auto;padding:16px 0}
  .hidden{display:none!important}
  h1{margin:0;font-size:52px;color:#ffe14d;-webkit-text-stroke:2px #4a2c07;text-shadow:0 4px 0 #4a2c07,0 8px 22px rgba(0,0,0,.6);letter-spacing:6px}
  h2{margin:0;font-size:26px;color:#ffe14d;-webkit-text-stroke:1px #4a2c07;text-shadow:0 2px 0 #4a2c07}
  .sub{color:#d8f5c6;font-size:16px;margin:0;text-shadow:0 2px 3px rgba(0,0,0,.6)}
  button{pointer-events:auto;font-family:inherit;cursor:pointer}
  .big{padding:12px 46px;font-size:22px;font-weight:700;color:#fff;border-radius:14px;border:3px solid #2c6a14;background:linear-gradient(#9ade54,#55a326);box-shadow:0 5px 0 #2c6a14,0 10px 18px rgba(0,0,0,.45);letter-spacing:6px}
  .big:hover{filter:brightness(1.08)}.big:active{transform:translateY(3px);box-shadow:0 2px 0 #2c6a14}
  .big:disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed}
  .alt{padding:9px 26px;font-size:15px;color:#fff;border-radius:10px;border:2px solid #7a5a20;background:linear-gradient(#e0b45c,#b7832c);box-shadow:0 4px 0 #7a5a20;letter-spacing:3px}
  .alt:hover{filter:brightness(1.08)}
  .minb{padding:4px 14px;font-size:12px;color:#eee;border-radius:8px;border:1px solid #666;background:#3a4a34;letter-spacing:2px}
  .card{background:rgba(255,249,226,.95);border:3px solid #8a5a2a;border-radius:14px;padding:10px 18px;color:#3b2f1d;box-shadow:0 10px 24px rgba(0,0,0,.4);font-size:13px}
  /* 关卡选择 */
  #levels .world{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:10px}
  .worldName{color:#ffe14d;font-size:16px;font-weight:700;text-shadow:0 2px 2px #000;letter-spacing:3px}
  .lvRow{display:flex;gap:10px}
  .lvNode{width:52px;height:52px;border-radius:50%;border:3px solid;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;text-shadow:0 1px 2px #000;pointer-events:auto;cursor:pointer;font-family:inherit;background:linear-gradient(#8bc45e,#5a9432);border-color:#2c6a14;box-shadow:0 3px 0 #2c6a14}
  .lvNode.done{background:linear-gradient(#5bb7d4,#2e7fa8);border-color:#1b5673}
  .lvNode.lock{background:linear-gradient(#777,#555);border-color:#333;cursor:not-allowed;box-shadow:none;color:#aaa}
  .lvNode:hover:not(.lock){filter:brightness(1.12)}
  /* 选卡 */
  #seedGrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:640px}
  .pk{width:62px;height:78px;background:#e9cb92;border:3px solid #7a4f21;border-radius:9px;display:flex;flex-direction:column;align-items:center;cursor:pointer;pointer-events:auto;padding:0}
  .pk img{width:56px;height:52px;image-rendering:auto}
  .pk span{font-size:12px;font-weight:700;color:#5a3a16}
  .pk.locked{filter:grayscale(1) brightness(.8);cursor:not-allowed}
  .pk.picked{border-color:#ffe14d;box-shadow:0 0 10px #ffe14d}
  .slotRow{display:flex;gap:6px;min-height:86px;align-items:center;background:rgba(90,58,22,.55);padding:6px 10px;border-radius:12px;border:2px solid #7a4f21}
  .slot{width:58px;height:74px;background:#e9cb92;border:3px dashed #a8814a;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;padding:0}
  .slot img{width:52px;height:48px}
  .slot.req{border-style:solid;border-color:#2c6a14}
  .slot span{font-size:20px;color:#a8814a}
  /* 图鉴 */
  #almanac .tabs{display:flex;gap:10px}
  .tab{padding:6px 22px;font-size:15px;font-weight:700;border-radius:10px;border:2px solid #8a5a2a;background:#e9cb92;color:#5a3a16;letter-spacing:4px}
  .tab.on{background:linear-gradient(#9ade54,#55a326);color:#fff;border-color:#2c6a14}
  #almGrid{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:600px;min-height:100px}
  .alm{width:56px;height:56px;border-radius:10px;border:2px solid #8a5a2a;background:rgba(255,249,226,.92);cursor:pointer;pointer-events:auto;padding:2px;display:flex;align-items:center;justify-content:center}
  .alm img{width:48px;height:46px}
  .alm.lock{filter:grayscale(1) brightness(.75);cursor:default}
  #almDetail{max-width:560px;min-height:96px;display:flex;gap:12px;align-items:center}
  #almDetail img{width:72px;height:72px;background:#fff8;border-radius:10px;padding:4px}
  #almDetail .nm{font-size:17px;font-weight:700;color:#7a4f10}
  #almDetail .fl{color:#8a6a3a;font-style:italic;margin-top:2px}
  #almDetail .st{font-size:12px;color:#3b2f1d;margin-top:3px}
  /* 结算 */
  .newCard{display:flex;flex-direction:column;align-items:center;gap:4px;background:radial-gradient(circle,#fff3c0,#e9cb92);border:3px solid #8a5a2a;border-radius:14px;padding:12px 26px;animation:glow 1.2s infinite alternate}
  @keyframes glow{from{box-shadow:0 0 8px #ffe14d}to{box-shadow:0 0 26px #ffe14d}}
  .newCard img{width:74px;height:70px}
  .trophy{font-size:64px}
  #pauseTip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;font-weight:700;text-shadow:0 3px 8px #000;background:rgba(0,0,0,.4);letter-spacing:6px}
  .credit{position:absolute;bottom:6px;width:100%;text-align:center;color:rgba(255,255,255,.4);font-size:11px;pointer-events:none}
  #dave .card{max-width:520px;font-size:14px}
  .daveName{color:#b45a1e;font-weight:700;font-size:16px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="ui">
    <div id="menu" class="panel">
      <h1>植物大战僵尸</h1>
      <p class="sub">冒险模式 · 五个世界 · 三十种植物</p>
      <button id="advBtn" class="big">冒 险 模 式</button>
      <div style="display:flex;gap:12px">
        <button id="almBtn" class="alt">图 鉴</button>
        <button id="resetBtn" class="minb">重置进度</button>
      </div>
      <div class="card" style="max-width:600px">
        <b>操作：</b>点阳光收集 · 点种子包→点草坪种植 · 右键/Esc 取消 · 1~9 快选 · P 暂停 · M 静音。<br>
        黑夜没有天降阳光，靠向日葵和蘑菇；泳池要先铺睡莲；浓雾用灯笼草照亮；屋顶必须先放花盆。
      </div>
    </div>
    <div id="levels" class="panel hidden">
      <h2>选择关卡</h2>
      <div id="worldList"></div>
      <button id="backBtn" class="alt">返 回</button>
    </div>
    <div id="seeds" class="panel hidden">
      <h2 id="seedTitle">选择你的种子！</h2>
      <div class="slotRow" id="slotRow"></div>
      <div id="seedGrid"></div>
      <div style="display:flex;gap:12px">
        <button id="fightBtn" class="big">开 始 战 斗</button>
        <button id="seedBack" class="alt">返 回</button>
      </div>
    </div>
    <div id="almanac" class="panel hidden">
      <h2>疯狂戴夫的图鉴</h2>
      <div class="tabs"><button class="tab on" id="tabP">植物</button><button class="tab" id="tabZ">僵尸</button></div>
      <div id="almGrid"></div>
      <div id="almDetail" class="card"></div>
      <button id="almBack" class="alt">返 回</button>
    </div>
    <div id="dave" class="panel hidden">
      <div class="card"><div class="daveName">疯狂戴夫：</div><div id="daveText"></div></div>
      <button id="daveOk" class="big">继 续</button>
    </div>
    <div id="end" class="panel hidden">
      <h1 id="endTitle"></h1>
      <p class="sub" id="endText"></p>
      <div id="endCards" style="display:flex;gap:16px"></div>
      <div style="display:flex;gap:14px">
        <button id="againBtn" class="big">再 来 一 局</button>
        <button id="nextBtn" class="big hidden">下 一 关</button>
        <button id="menuBtn" class="alt">返回选关</button>
      </div>
    </div>
    <div id="pauseTip" class="hidden">已暂停 · 按 P 继续</div>
    <div class="credit">致敬 PopCap《Plants vs. Zombies》· 纯 Canvas 参数化手绘重制</div>
  </div>
</div>
<script>

const cv=document.getElementById('cv');let ctx=cv.getContext('2d');

cv.width=W*SS;cv.height=H*SS;
function fit(){const r=Math.min(innerWidth/W,(innerHeight-4)/H);cv.style.width=(W*r)+'px';cv.style.height=(H*r)+'px';const u=document.getElementById('ui');u.style.width=cv.style.width;u.style.height=cv.style.height;}
addEventListener('resize',fit);fit();
const GX=90,GY=100,CW=96,COLS=9;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function rrOn(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function ell(x,y,rx,ry,col){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fill();}
function easeOutBack(t){const s=1.70158;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2);}
function cellCX(c){return GX+c*CW+CW/2;}

const ZPOOL=[

 [['paper',2,1],['normal',2,1],['cone',2,1],['bucket',.8,2],['imp',1,3],['garg',.4,5]],

function levelDef(idx){ // idx 0..24
  const wi=idx/5|0,li=idx%5+1,w=WORLDS[wi];
  const budget=Math.round(9+li*4.5+wi*7);
  const nW=li===5?10:8;
  const ROWS=w.rows.length,CH=Math.floor((H-GY-22)/ROWS);
  const waves=[];let left=budget;
  const t0=20+li*3,gap=(150-li*4)/nW;
  for(let i=0;i<nW;i++){
    const huge=(i===(nW>>1))||i===nW-1;
    let n=Math.max(1,Math.round(budget/nW*(huge?2.1:1)*rand(.85,1.15)));
    if(i===nW-1)n=Math.max(n,3);
    waves.push({t:t0+gap*(i+1)+ (i===0?0:rand(-3,3)),huge,final:i===nW-1,n});
  }
  return {idx,wi,li,w,ROWS,CH,waves,totalZ:budget};
}
// 按权重从关卡池取一种僵尸
function pickZombie(ld,huge){
  const pool=ZPOOL[ld.wi].filter(z=>z[2]<=ld.li);
  let tw=0;for(const z of pool)tw+=z[1];
  let r=Math.random()*tw;
  for(const z of pool){r-=z[1];if(r<=0)return z[0];}
  return 'normal';
}

function noiseS(dur,vol,lp,delay=0){const a=ac();if(!a||muted)return;const t0=a.currentTime+delay;const n=Math.floor(a.sampleRate*dur);const buf=a.createBuffer(1,n,a.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;const g=a.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);s.connect(f).connect(g).connect(a.destination);s.start(t0);}

function canPlace(k,r,c){
  const d=PD[k],w=LD.w,water=waterRow(r);
  const grave=graveAt(r,c),base=baseAt(r,c),main=plantAt(r,c);
  if(craterAt(r,c))return 'grave';
  if(k==='pumpkin')return main&&!main.shell?'ok':(main?'has':'empty');
  if(grave)return k==='gravebuster'&&!main?'ok':'grave';
  if(k==='gravebuster')return 'noGrave';
  if(d.night&&!w.night)return 'day';
  if(d.aquatic){ // lily/kelp 只进水
    if(k==='lily')return water&&!base&&!main?'ok':(water?'occ':'land');
    if(k==='kelp')return water&&!main&&!base?'ok':(water?'occ':'land');
  }
  if(k==='pot')return w.roof&&!base&&!main?'ok':(w.roof?'occ':'land');
  if(k==='spikeweed'&&water)return 'water';
  if(main)return 'occ';
  if(water&&!base)return 'needLily';
  if(w.roof&&!base)return 'needPot';
  return 'ok';
}

function hurt(z,d,opts){
  if(z.dead)return;

// ============================================================ 更新
function update(dt){
  bgmTick();
  if(S.over){S.overT+=dt;updParts(dt);if(S.banner){S.banner.t+=dt;if(S.banner.t>S.banner.dur)S.banner=null;}
    if(S.overT>1.4&&!S.endShown)showEnd();return;}
  S.t+=dt;
  if(S.banner){S.banner.t+=dt;if(S.banner.t>S.banner.dur)S.banner=null;}
  S.shake=Math.max(0,S.shake-dt*26);S.sunPulse=Math.max(0,S.sunPulse-dt*3);S.eatT=Math.max(0,S.eatT-dt);
  if(S.fogClear>0)S.fogClear-=dt;
  for(const cr of S.craters)cr.t-=dt;S.craters=S.craters.filter(c=>c.t>0);
  // 天降阳光
  if(LD.w.skySun){
    S.skySunT-=dt;
    if(S.skySunT<=0){S.skyN++;S.skySunT=S.skyN<=3?8:rand(8.5,12);
      S.suns.push({x:rand(GX+30,GX+COLS*CW-30),y:-30,ty:rand(GY+50,GY+LD.ROWS*LD.CH-20),vy:34,land:false,life:11,val:25,fly:null,ph:rand(0,9),vx:0,g:0});}
  }
  // 波次
  const waves=S.waves,nw=waves[S.waveI];
  if(nw&&nw.huge&&!nw.warned&&S.t>=nw.t-4){nw.warned=true;banner(nw.final?'最 后 一 波 ！！！':'一大波僵尸正在接近！',3.2);SFX.horde();}
  while(S.waveI<waves.length&&S.t>=waves[S.waveI].t){
    const wv=waves[S.waveI];
    for(let k=0;k<wv.n;k++)S.spawnQ.push({t:S.t+rand(0,wv.huge?9:7),type:pickZombie(LD,wv.huge),row:Math.floor(Math.random()*LD.ROWS)});
    if(wv.huge){S.spawnQ.push({t:S.t+1,type:'flag',row:Math.floor(Math.random()*LD.ROWS)});
      // 黑夜墓碑吐僵尸
      for(const g of S.graves){if(Math.random()<.7)S.spawnQ.push({t:S.t+rand(2,8),type:Math.random()<.5?'cone':'normal',row:g.r,atGrave:g});}
    }
    S.waveI++;
  }
  for(const q of S.spawnQ)if(S.t>=q.t){const z=spawnZombie(q.type,q.row);if(q.atGrave){z.x=cellCX(q.atGrave.c)+rand(-10,10);z.fromGrave=true;z.rise=0.8;}q.done=true;}
  S.spawnQ=S.spawnQ.filter(q=>!q.done);
  updPlants(dt);
  updZombies(dt);
  updShots(dt);
  // 阳光
  for(const su of S.suns){
    if(su.fly){const dx=52-su.x,dy=40-su.y,d=Math.hypot(dx,dy);
      if(d<16){su.rm=true;S.sun+=su.val;S.sunPulse=1;}
      else{su.x+=dx/d*1050*dt;su.y+=dy/d*1050*dt;}continue;}
    if(!su.land){
      if(su.g>0){su.vy+=su.g*dt;su.x+=su.vx*dt;su.y+=su.vy*dt;if(su.vy>0&&su.y>=su.ty)su.land=true;}
      else{su.y+=su.vy*dt;if(su.y>=su.ty)su.land=true;}
    }else{su.life-=dt;if(su.life<=0)su.rm=true;}
  }
  S.suns=S.suns.filter(s=>!s.rm);
  // 推车
  for(const m of S.mowers){
    if(!m.on)continue;
    m.x+=345*dt;
    if(Math.random()<0.7)S.parts.push({x:m.x-20,y:rowBase(m.row)-4,vx:rand(-120,-60),vy:rand(-90,-30),g:300,life:.4,max:.4,r:rand(2,4),col:m.water?'#8ec7e8':'#5c8a2e'});
    for(const z of S.zombies){if(z.dead||z.row!==m.row)continue;
      if(Math.abs(z.x-m.x)<48){killZ(z);for(let i=0;i<8;i++)S.parts.push({x:z.x,y:rowBase(z.row)-rand(20,70),vx:rand(-60,180),vy:rand(-160,-40),g:400,life:.5,max:.5,r:rand(2,5),col:'#8ba06a'});}}
    if(m.x>W+70){m.on=false;m.gone=true;}
  }
  for(let i=0;i<6;i++)S.rowFlash[i]=Math.max(0,(S.rowFlash[i]||0)-dt);
  updParts(dt);
  for(const sc of S.scorch)sc.a-=dt/12;S.scorch=S.scorch.filter(s=>s.a>0);
  for(const k in S.cds)S.cds[k]=Math.max(0,S.cds[k]-dt);
  if(S.zombies.length){S.groanT-=dt;if(S.groanT<=0){S.groanT=rand(6,14);SFX.groan();}}
  // 胜利
  if(S.waveI>=S.waves.length&&!S.spawnQ.length&&!S.zombies.length){S.over=1;S.overT=0;banner('关卡完成！',2);SFX.win();}
}
function updParts(dt){
  for(const q of S.parts){
    q.life-=dt;
    if(q.ring){q.r+=q.vr*dt;continue;}
    q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;
  }
  S.parts=S.parts.filter(q=>q.life>0);
}

function firePea(p,snow,row,spike){
  const r0=row===undefined?p.row:row;
  S.peas.push({x:p.cx+20,y:rowBase(r0)-LD.CH*.56,row:r0,snow:!!snow,fire:false,spike:!!spike,dmg:20,rm:false,maxX:spike?W+40:(p.kind==='puff'?p.cx+3*CW:W+40)});
  SFX.pea();p.rec=0.12;
}
function updPlants(dt){
  for(const p of S.plants){
    if(p.rm)continue;
    p.age+=dt;p.hitT=Math.max(0,p.hitT-dt);p.rec=Math.max(0,(p.rec||0)-dt);
    if(p.age>0.25&&p.hp<=0){p.rm=true;leafBurst(p);continue;}
    const w=LD.w;
    switch(p.kind){
      case 'sunflower':case 'sunshroom':{
        const grown=p.kind==='sunflower'||p.grow<=0;

        if(p.timer<=0){p.timer=24;const val=p.kind==='sunflower'?25:(grown?25:15);
          S.suns.push({x:p.cx+rand(-8,8),y:p.cy-46,ty:p.cy-rand(-4,10),vy:-110,land:false,life:11,val,fly:null,ph:rand(0,9),vx:rand(-22,22),g:300});}
        if(p.kind==='sunshroom')p.grow-=dt;
        break;}
      case 'peashooter':case 'snowpea':case 'repeater':case 'cactus':case 'puff':{
        const has=S.zombies.some(z=>!z.dead&&!z.under&&!z.bun&&z.row===p.row&&z.x>p.cx-24&&z.x<W+40&&(!z.fly||p.kind==='cactus')&&!z.dive);
        const air=S.zombies.some(z=>!z.dead&&z.fly&&z.row===p.row&&z.x>p.cx-24);
        p.cool-=dt;
        if((has||air)&&p.cool<=0){p.cool=1.4;firePea(p,p.kind==='snowpea',undefined,p.kind==='cactus');if(p.kind==='repeater')p.pend=.16;}
        if(p.pend>0){p.pend-=dt;if(p.pend<=0)firePea(p,false,undefined,false);}
        break;}
      case 'threepeater':{
        p.cool-=dt;
        const has=S.zombies.some(z=>!z.dead&&!z.under&&!z.bun&&!z.fly&&!z.dive&&(Math.abs(z.row-p.row)<=1)&&z.x>p.cx-24&&z.x<W+40);
        if(has&&p.cool<=0){p.cool=1.4;
          for(const r of [p.row-1,p.row,p.row+1])if(r>=0&&r<LD.ROWS)firePea(p,false,r,false);}
        break;}
      case 'fume':{
        p.cool-=dt;
        const zs=S.zombies.filter(z=>!z.dead&&!z.under&&!z.bun&&!z.fly&&z.row===p.row&&z.x>p.cx&&z.x<p.cx+4*CW);

          if(z.x<p.cx+42&&z.x>p.cx-52){p.rm=true;explode(p.cx,p.row,false);break;}}}

      case 'cherry':p.fuse-=dt;if(p.fuse<=0){p.rm=true;explode(p.cx,p.row,true);}break;
      case 'doom':

        break;
      case 'jalapeno':{

        if(p.fuse<=0){p.rm=true;SFX.boom();S.shake=10;S.rowFlash[p.row]=.6;

          for(const z of S.zombies)if(z.row===p.row&&!z.dead)hurt(z,1800);}

          if(best){if(best.garg){hurt(best,900);p.chew=10;}
            else{best.gone=true;best.hp=0;S.kills++;p.chew=32;SFX.gulp();}
            for(let i=0;i<6;i++)S.parts.push({x:p.cx+26,y:p.cy-LD.CH*.5,vx:rand(-40,60),vy:rand(-80,-20),g:300,life:.4,max:.4,r:3,col:'#9b59d0'});}}
        break;
      case 'squash':{
        if(!p.sq){
          let best=null;
          for(const z of S.zombies){if(z.dead||z.row!==p.row||z.under||z.fly||z.bun||z.dive)continue;
            if(Math.abs(z.x-p.cx)<1.5*CW&&(!best||Math.abs(z.x-p.cx)<Math.abs(best.x-p.cx)))best=z;}
          if(best)p.sq={t:0,tx:best.x};
        }else{
          p.sq.t+=dt;
          if(p.sq.t>=0.9){p.rm=true;S.shake=Math.max(S.shake,7);SFX.smash();
            for(const z of S.zombies){if(z.dead||z.row!==p.row||z.under||z.fly)continue;
              if(Math.abs(z.x-p.sq.tx)<70)hurt(z,1800);}
            for(let i=0;i<12;i++)S.parts.push({x:p.sq.tx+rand(-30,30),y:rowBase(p.row)-10,vx:rand(-80,80),vy:rand(-140,-40),g:320,life:.5,max:.5,r:rand(2,5),col:'#c9b45a'});}
        }
        break;}
      case 'spikeweed':{
        p.cool-=dt;
        if(p.cool<=0){p.cool=.7;
          for(const z of S.zombies){if(z.dead||z.row!==p.row||z.under||z.fly||z.bun)continue;
            if(Math.abs(z.x-p.cx)<CW*.55){hurt(z,20);S.parts.push({x:z.x,y:rowBase(z.row)-6,vx:rand(-30,30),vy:rand(-60,-20),g:200,life:.3,max:.3,r:2,col:'#d8c8a0'});}}}
        break;}
      case 'kelp':{
        for(const z of S.zombies){if(z.dead||z.row!==p.row||z.under||z.fly||z.bun)continue;
          if(Math.abs(z.x-p.cx)<40){z.gone=true;S.kills++;p.rm=true;SFX.splash();
            for(let i=0;i<12;i++)S.parts.push({x:p.cx+rand(-16,16),y:rowBase(p.row)-rand(0,30),vx:rand(-40,40),vy:rand(-140,-40),g:400,life:.5,max:.5,r:rand(2,4),col:'#7fc9e8'});}}
        break;}
      case 'gravebuster':
        p.timer2=(p.timer2||3)-dt;
        if(p.timer2<=0){const g=graveAt(p.row,p.col);if(g){g.eaten=true;S.graves=S.graves.filter(x=>!x.eaten);}p.rm=true;SFX.gulp();}
        break;
      case 'blover':
        p.fuse-=dt;
        if(p.fuse<=0){p.rm=true;SFX.pop();S.fogClear=20;
          for(const z of S.zombies){if(z.fly&&!z.dead){z.fly=false;z.drop=0.5;hurt(z,1800);}}
          for(let i=0;i<14;i++)S.parts.push({x:GX+rand(0,COLS*CW),y:rowBase(p.row)-rand(0,80),vx:rand(150,320),vy:rand(-20,20),g:0,life:.5,max:.5,r:rand(2,4),col:'#bfe8a0'});}
        break;
      case 'torchwood':case 'lily':case 'pot':case 'plantern':case 'pumpkin':case 'starfruit':
        if(p.kind==='starfruit'){
          p.cool-=dt;
          const has=S.zombies.some(z=>!z.dead&&!z.under&&!z.bun&&!z.dive&&Math.abs(z.row-p.row)<=1&&z.x<GX+COLS*CW+40);
          if(has&&p.cool<=0){p.cool=1.4;
            for(const [vx,vy] of [[1,0],[-1,0],[0,-1],[0,1],[.7,-.7]])S.stars.push({x:p.cx,y:p.cy-LD.CH*.5,vx:vx*300,vy:vy*300,dmg:20,rm:false,life:2.2});}
        }
        break;
      case 'cabbage':case 'kernel':case 'melon':{
        p.cool-=dt;
        if(p.cool<=0){
          let best=null;
          for(const z of S.zombies){if(z.dead||z.under||z.bun||z.row!==p.row||z.x<p.cx)continue;
            if(z.x<W+40&&(!best||z.x<best.x)&&(!z.fly||true))best=z;}
          if(best){p.cool=2.4;const dmg=p.kind==='melon'?80:(p.kind==='cabbage'?40:20);
            const butter=p.kind==='kernel'&&Math.random()<.25;
            S.lobs.push({x0:p.cx,y0:p.cy-LD.CH*.62,x1:best.x,y1:rowBase(best.row)-(best.fly?90:50),t:0,T:Math.max(.5,Math.abs(best.x-p.cx)/300+.4),row:best.row,dmg,butter,melon:p.kind==='melon',kind:p.kind,zTarget:best});
            p.rec=0.2;SFX.lob();
          }else p.cool=0.2;
        }
        break;}
    }
  }
  S.plants=S.plants.filter(p=>!p.rm);
}
// ---------------- 僵尸
function updZombies(dt){
  for(const z of S.zombies){
    if(z.gone)continue;
    if(z.dead){z.dead+=dt;if(z.dead>0.85)z.gone=true;continue;}
    z.flash=Math.max(0,z.flash-dt);
    if(z.slow>0)z.slow-=dt;
    if(z.stun>0){z.stun-=dt;continue;}
    if(z.rise>0){z.rise-=dt;continue;} // 墓碑爬出
    if(z.drop>0){z.drop-=dt;if(z.drop<=0)SFX.hit();continue;} // 空降(小鬼/气球爆)
    // 蹦极
    if(z.bun){
      const b=z.bun,ty=rowBase(b.r)-40;
      if(b.ph==='drop'){b.y+=280*dt;if(b.y>=ty){b.ph='grab';b.t=0;SFX.bungee();
        const m=plantAt(b.r,b.c)||baseAt(b.r,b.c);
        if(m){m.rm=true;b.carry=m;leafBurst(m);}else b.ph='up';}}
      else if(b.ph==='grab'){b.t+=dt;if(b.t>0.25)b.ph='up';}
      else{b.y-=300*dt;if(b.y<-90)z.gone=true;}
      continue;
    }
    // 投石车
    if(z.cat){
      const c=z.cat;
      if(c.ph==='drive'){
        z.x-=z.speed*dt;
        const hasTarget=S.plants.some(p=>!p.rm&&p.row===z.row);
        if(z.x<=c.x||!hasTarget){if(hasTarget)c.ph='shoot';else if(z.x<GX-40){gameLose();return;}}
      }else{
        c.t-=dt;
        if(c.t<=0){c.t=3.2;
          const mains=S.plants.filter(p=>!p.rm&&p.row===z.row);
          if(mains.length){const tp=mains[Math.floor(Math.random()*mains.length)];
            S.lobs.push({x0:z.x,y0:rowBase(z.row)-80,x1:tp.cx,y1:tp.cy-30,t:0,T:.8,row:z.row,dmg:0,ball:true,zp:tp});
            SFX.lob();z.rec=0.3;
          }else c.ph='drive';}
      }
      if(z.x<GX-58){gameLose();return;}
      continue;
    }
    const front=z.x-26;
    // 气球: 飞行
    if(z.fly){
      z.x-=z.speed*(z.slow>0?.5:1)*dt;
      if(z.x<GX-58){gameLose();return;}
      continue;
    }
    // 矿工: 地下
    if(z.under){
      z.x-=z.speed*(z.slow>0?.5:1)*dt;
      if(z.x<cellCX(0)-10){z.under=false;z.dirR=true;z.speed=10;z.riseT=0.5;SFX.pop();}
      continue;
    }
    // 找目标(矿工向右) — 优先啃主体植物,其次啃基座
    let target=null,baseT=null;
    const mouth=z.dirR?z.x+16:z.x-16;
    for(const p of S.plants){
      if(p.rm||p.row!==z.row||p.kind==='potato'||p.kind==='spikeweed'||p.kind==='kelp')continue;
      if(Math.abs(p.cx-mouth)>=38)continue;
      if(p.base){if(!baseT)baseT=p;}
      else{target=p;break;}
    }
    if(!target)target=baseT;
    // 潜水: 无目标时下潜, 有目标时浮起
    if(z.dive!==undefined&&ZD[z.type].snorkel){
      z.dive=!target;
    }
    const spdMul=(z.slow>0?0.5:1)*(z.rage?2.3:1);
    // 撑杆跳
    if(z.pole&&target&&target.kind!=='tallnut'){
      z.pole=false;z.vault={t:0,x0:z.x,x1:target.cx-34};SFX.vault();
    }
    if(z.vault){
      z.vault.t+=dt;const k=z.vault.t/0.55;
      z.x=z.vault.x0+(z.vault.x1-z.vault.x0)*Math.min(1,k);
      if(k>=1){z.vault=null;z.speed=10;}
      continue;
    }
    if(z.garg){
      if(z.smash>0){z.smash-=dt;
        if(z.smash<=0&&target){target.hp=0;target.rm=true;leafBurst(target);S.shake=Math.max(S.shake,8);SFX.smash();}}
      else if(target)z.smash=0.9;
      else{z.x-=z.speed*spdMul*dt;if(z.x<GX-58){gameLose();return;}}
      continue;
    }
    if(target){
      z.eat=true;z.biteT-=dt;
      if(z.biteT<=0){z.biteT=0.5;
        if(target.shell>0){target.shell-=40;if(target.shell<=0)SFX.armorPop();}
        else{target.hp-=40;target.hitT=0.3;}
        if(S.eatT<=0){SFX.eat();S.eatT=0.22;}
        for(let i=0;i<3;i++)S.parts.push({x:target.cx+rand(-10,14),y:target.cy-LD.CH*rand(.2,.45),vx:rand(-50,20),vy:rand(-70,-10),g:260,life:.4,max:.4,r:2.5,col:'#7fae3f'});
        if(target.hp<=0){target.rm=true;leafBurst(target);}}
    }else{z.eat=false;z.x-=z.speed*spdMul*dt;}
    // 推车
    if(front<GX+4){
      const m=S.mowers[z.row];
      if(!m.on&&!m.gone){m.on=true;SFX.mower();S.shake=Math.max(S.shake,4);}
      else if(!m.on&&front<GX-58){gameLose();return;}
    }
  }
  S.zombies=S.zombies.filter(z=>!z.gone);
}
function gameLose(){if(S.over)return;S.over=2;S.overT=0;SFX.lose();bgm.on=false;}
// ---------------- 投射物
function updShots(dt){
  // 直射
  for(const pe of S.peas){
    pe.x+=340*dt;
    if(pe.x>pe.maxX||pe.x>W+40){pe.rm=true;continue;}
    for(const tw of S.plants){ // 火炬
      if(tw.kind==='torchwood'&&tw.row===pe.row&&!pe.fire&&!pe.snow&&Math.abs(tw.cx-pe.x)<14){pe.fire=true;pe.dmg=40;}
    }
    for(const z of S.zombies){
      if(z.dead||z.row!==pe.row||z.under||z.bun)continue;
      if(z.fly&&!pe.spike)continue;
      if(z.dive)continue;
      if(pe.x>z.x-30&&pe.x<z.x+30){
        pe.rm=true;z.flash=0.12;hurt(z,pe.dmg);
        if(pe.snow){z.slow=4;SFX.freeze();}else SFX.hit();
        for(let i=0;i<4;i++)S.parts.push({x:pe.x+4,y:pe.y,vx:rand(-90,-10),vy:rand(-70,30),g:300,life:.3,max:.3,r:rand(2,3.5),col:pe.fire?'#ffb02e':(pe.snow?'#bfeaff':'#8fd44e')});
        break;}
    }
  }
  S.peas=S.peas.filter(p=>!p.rm);
  // 星星
  for(const st of S.stars){
    st.life-=dt;st.x+=st.vx*dt;st.y+=st.vy*dt;
    if(st.life<=0||st.x<-40||st.x>W+40||st.y<GY-60||st.y>H){st.rm=true;continue;}
    for(const z of S.zombies){
      if(z.dead||z.under||z.bun||z.fly||z.dive)continue;
      const zx=z.x,zy=rowBase(z.row)-LD.CH*.52;
      if(Math.hypot(zx-st.x,zy-st.y)<30){st.rm=true;z.flash=.12;hurt(z,st.dmg);SFX.hit();break;}
    }
  }
  S.stars=S.stars.filter(s=>!s.rm);
  // 喷雾
  for(const f of S.fumes)f.life-=dt;
  S.fumes=S.fumes.filter(f=>f.life>0);
  // 抛物线
  for(const lb of S.lobs){
    lb.t+=dt;
    if(lb.t>=lb.T){
      lb.rm=true;
      if(lb.ball){ // 投石车篮球: 砸植物
        lobHitTarget(lb.x1,lb.row,lb.zp&&!lb.zp.rm?lb.zp:null);S.shake=Math.max(S.shake,5);SFX.smash();
        for(let i=0;i<8;i++)S.parts.push({x:lb.x1+rand(-20,20),y:lb.y1,vx:rand(-60,60),vy:rand(-100,-20),g:300,life:.4,max:.4,r:3,col:'#e8a04a'});
      }else{
        for(const z of S.zombies){
          if(z.dead||z.row!==lb.row||z.under||z.bun)continue;
          if(z.dive)continue;
          if(Math.abs(z.x-lb.x1)<44){z.flash=.12;hurt(z,lb.dmg);
            if(lb.butter){z.stun=4;SFX.butter();}
            if(lb.melon){for(const z2 of S.zombies){if(z2.dead||z2.row!==lb.row||z2.under||z2===z||z2.dive)continue;
              if(Math.abs(z2.x-lb.x1)<80)hurt(z2,40);}}
            break;}
        }
        for(let i=0;i<8;i++)S.parts.push({x:lb.x1+rand(-14,14),y:lb.y1,vx:rand(-60,60),vy:rand(-90,-20),g:300,life:.4,max:.4,r:rand(2,4),col:lb.melon?'#8fd44e':(lb.kind==='kernel'?'#ffe14d':'#a8d060')});
        SFX.hit();
      }
    }
  }
  S.lobs=S.lobs.filter(l=>!l.rm);
}

// ============================================================ 背景烘焙(每世界一张)
const BGS=[];
function bakeWorlds(){
  for(let wi=0;wi<5;wi++){
    const w=WORLDS[wi],ROWS=w.rows.length,CH=Math.floor((H-GY-22)/ROWS);
    const bg=document.createElement('canvas');bg.width=W;bg.height=H;const c=bg.getContext('2d');
    const night=!!w.night,roof=!!w.roof;
    // 天空区(顶栏后面/页面底色由panel盖住, 这里给左右侧)
    if(roof){
      const sk=c.createLinearGradient(0,0,0,H);sk.addColorStop(0,'#e8a05a');sk.addColorStop(.5,'#c97a4e');sk.addColorStop(1,'#8a4a3a');
      c.fillStyle=sk;c.fillRect(0,0,W,H);
      c.fillStyle='#7d4430';c.fillRect(GX+COLS*CW,GY-6,W-GX-COLS*CW,ROWS*CH+12);
    }else{
      c.fillStyle=w.side;c.fillRect(0,0,W,H);
      if(night){c.fillStyle='rgba(10,16,34,.35)';c.fillRect(0,0,W,H);}
    }
    // 行底
    for(let r=0;r<ROWS;r++){
      const water=w.rows[r]==='w',y=GY+r*CH;
      if(water){
        const g=c.createLinearGradient(0,y,0,y+CH);g.addColorStop(0,'#4a9ad4');g.addColorStop(1,'#2e6fa8');
        c.fillStyle=g;c.fillRect(GX,y,COLS*CW,CH);
      }else if(roof){
        for(let cc=0;cc<COLS;cc++){c.fillStyle=(r+cc)%2?w.gA:w.gB;c.fillRect(GX+cc*CW,y,CW,CH);
          c.strokeStyle='rgba(60,25,15,.25)';c.lineWidth=2;c.strokeRect(GX+cc*CW+2,y+2,CW-4,CH-4);}
      }else{
        c.fillStyle=w.side;c.fillRect(GX,y,COLS*CW,CH);
        for(let cc=0;cc<COLS;cc++){c.fillStyle=(r+cc)%2?w.gA:w.gB;c.fillRect(GX+cc*CW+1,y,CW-2,CH);}
      }
    }
    // 草纹
    if(!roof)for(let i=0;i<300;i++){
      const r=Math.floor(Math.random()*ROWS);if(w.rows[r]==='w')continue;

      c.strokeStyle=night?(Math.random()<.5?'rgba(200,220,180,.05)':'rgba(0,20,0,.14)'):(Math.random()<.5?'rgba(255,255,255,.08)':'rgba(30,80,20,.10)');
      c.lineWidth=1.4;c.beginPath();c.moveTo(x,y);c.lineTo(x+rand(-2,2),y-rand(3,7));c.stroke();
    }
    // 水波
    for(let r=0;r<ROWS;r++){if(w.rows[r]!=='w')continue;const y=GY+r*CH;
      for(let i=0;i<50;i++){const x=rand(GX+4,GX+COLS*CW-14),yy=y+rand(8,CH-8);
        c.strokeStyle='rgba(255,255,255,.13)';c.lineWidth=2;c.beginPath();c.moveTo(x,yy);c.quadraticCurveTo(x+6,yy-3,x+12,yy);c.stroke();}
      c.fillStyle='rgba(255,255,255,.25)';c.fillRect(GX,y,COLS*CW,3);
    }
    c.fillStyle='rgba(0,0,0,.16)';c.fillRect(GX,GY,COLS*CW,5);
    // 左侧房子
    if(!roof){
      const g0=c.createLinearGradient(0,0,46,0);g0.addColorStop(0,night?'#8a8298':'#efe3c0');g0.addColorStop(1,night?'#6f6880':'#d9c9a4');
      c.fillStyle=g0;c.fillRect(0,0,46,H);
      c.strokeStyle='rgba(120,90,50,.3)';c.lineWidth=1;
      for(let y=8;y<H;y+=26){c.beginPath();c.moveTo(0,y);c.lineTo(46,y);c.stroke();}
      c.fillStyle=night?'#2c3a55':'#5f7d9e';rrOn(c,8,168,30,88,4);c.fill();c.strokeStyle='#8a6a3a';c.lineWidth=4;rrOn(c,8,168,30,88,4);c.stroke();
      rrOn(c,8,430,30,88,4);c.fillStyle=night?'#2c3a55':'#5f7d9e';c.fill();c.strokeStyle='#8a6a3a';c.lineWidth=4;rrOn(c,8,430,30,88,4);c.stroke();
      // 砖路
      c.fillStyle=night?'#7d7568':'#b3a893';c.fillRect(46,GY-6,GX-46,ROWS*CH+12);
      c.strokeStyle='rgba(80,65,45,.35)';c.lineWidth=2;
      for(let y=GY-6;y<GY+ROWS*CH+6;y+=36){c.beginPath();c.moveTo(46,y);c.lineTo(GX,y);c.stroke();}
      c.fillStyle='rgba(0,0,0,.18)';c.fillRect(46,GY-6,6,ROWS*CH+12);
    }else{
      // 屋顶左沿: 屋脊+天窗
      c.fillStyle='#8a8070';c.fillRect(0,GY-6,46,ROWS*CH+12);
      c.fillStyle='#6a6050';c.fillRect(40,GY-6,8,ROWS*CH+12);
    }
    // 右侧
    c.fillStyle=w.side;c.fillRect(GX+COLS*CW,GY-6,W-GX-COLS*CW,ROWS*CH+12);
    for(let i=0;i<60;i++){const x=rand(GX+COLS*CW+6,W-4),y=rand(GY-4,GY+ROWS*CH+4);
      c.strokeStyle='rgba(0,30,0,.16)';c.lineWidth=1.3;c.beginPath();c.moveTo(x,y);c.lineTo(x+rand(-2,2),y-rand(3,6));c.stroke();}
    if(wi===0||wi===2){c.fillStyle='#9aa2a8';rrOn(c,W-40,150,30,46,10);c.fill();c.fillStyle='#7d858c';rrOn(c,W-34,300,32,52,11);c.fill();
      c.fillStyle='rgba(60,66,70,.8)';c.font='bold 13px sans-serif';c.fillText('R.I.P',W-32,332);}
    if(night){ // 月亮与星
      c.fillStyle='#f4f0d0';c.beginPath();c.arc(W-70,60,26,0,TAU);c.fill();
      c.fillStyle=w.side;c.beginPath();c.arc(W-82,52,22,0,TAU);c.fill();
      for(let i=0;i<24;i++){c.fillStyle=`rgba(255,255,240,${rand(.3,.9)})`;c.fillRect(rand(60,W-120),rand(10,90),2,2);}
    }
    if(roof){c.fillStyle='#7a4030';c.fillRect(W-70,GY+30,44,70);c.fillStyle='#5a2c20';c.fillRect(W-76,GY+22,56,12);c.fillStyle='rgba(0,0,0,.25)';c.fillRect(W-56,GY+60,16,40);}
    // 顶栏
    const g1=c.createLinearGradient(0,0,0,90);g1.addColorStop(0,'#8a5a2a');g1.addColorStop(1,'#6e451d');
    c.fillStyle=g1;c.fillRect(0,0,W,90);
    c.strokeStyle='rgba(60,35,12,.35)';c.lineWidth=1.6;
    for(let i=0;i<9;i++){const y=8+i*9;c.beginPath();c.moveTo(0,y);c.bezierCurveTo(W*.3,y+rand(-3,3),W*.7,y+rand(-3,3),W,y);c.stroke();}
    c.fillStyle='rgba(0,0,0,.3)';c.fillRect(0,88,W,4);
    c.fillStyle='rgba(0,0,0,.22)';c.fillRect(0,H-14,W,14);
    BGS.push(bg);
  }
}

// ============================================================ 植物绘制
let drawScale=1;
function drawPlantAt(kind,x,y,s,st){
  const old=drawScale;drawScale=s;
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);drawPlantArt(kind,st||{});ctx.restore();
  drawScale=old;
}
function drawPlantArt(k,p){
  const t=visT+(p.ph||0);
  const hpR=p.maxHp?p.hp/p.maxHp:1;
  const sc=LD?LD.CH/104:1; // 6行世界略小
  ell(0,2,22*sc,5*sc,'rgba(0,0,0,.18)');
  ctx.save();ctx.scale(sc,sc);
  const ageR=clamp((p.age===undefined?1:p.age)/0.25,0,1);
  if(ageR<1){const s2=.6+.4*easeOutBack(ageR);ctx.translate(0,(1-ageR)*10);ctx.scale(s2,s2);}
  if(p.hitT>0)ctx.translate(Math.sin(t*46)*2.2,0);
  if(k==='wallnut'){drawWallnut(p,hpR,t,1);}
  else if(k==='tallnut'){drawWallnut(p,hpR,t,1.45);}
  else if(k==='potato'){drawPotato(p,t);}
  else if(k==='spikeweed')drawSpikeweed(p,t);
  else if(k==='lily')drawLily(p,t);
  else if(k==='pot')drawPot(p,t);
  else if(k==='pumpkin'){drawPumpkinShell(p,t);}
  else if(k==='kelp')drawKelp(p,t);
  else{
    // 通用茎叶
    ctx.rotate(Math.sin(t*1.7)*0.021);
    ctx.strokeStyle='#3e8b22';ctx.lineWidth=7;ctx.lineCap='round';
    if(k!=='squash'&&k!=='doom'&&k!=='jalapeno'&&k!=='blover'&&k!=='cactus'&&k!=='torchwood'){
      ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(3,-20,0,-36);ctx.stroke();
      leaf(-4,-6,-0.9,'#4aa027');leaf(4,-3,0.8,'#3e8b22');
    }
    const bob=Math.sin(t*2.2)*1.6;
    ctx.translate(0,-36+bob);
    const rec=p.rec||0;
    if(k==='sunflower')drawSunflowerHead(t);
    else if(k==='peashooter')drawShooterHead('#5db83a','#4aa027',t,false,false,rec);
    else if(k==='snowpea')drawShooterHead('#79c7e8','#5aadd4',t,true,false,rec);
    else if(k==='repeater')drawShooterHead('#3fa32f','#2f8f22',t,false,true,rec);
    else if(k==='puff')drawShroomHead(t,'#c8b8d8',10,false);
    else if(k==='sunshroom')drawSunShroom(p,t);
    else if(k==='fume')drawShroomHead(t,'#9b59d0',15,true);
    else if(k==='gravebuster')drawGraveBuster(p,t);
    else if(k==='doom')drawDoom(p,t);
    else if(k==='chomper')drawChomper(p,t);
    else if(k==='cherry')drawCherry(p,t);
    else if(k==='threepeater')drawThreepeater(t,rec);
    else if(k==='squash')drawSquash(p,t);
    else if(k==='jalapeno')drawJalapeno(p,t);
    else if(k==='torchwood')drawTorchwood(t);
    else if(k==='plantern')drawPlantern(t);
    else if(k==='cactus')drawCactus(t,rec);
    else if(k==='blover')drawBlover(p,t);
    else if(k==='starfruit')drawStarfruit(t,rec);
    else if(k==='cabbage')drawPult(t,rec,'#8fd44e','#5aa828','cab');
    else if(k==='kernel')drawPult(t,rec,'#ffe14d','#d4a017','ker');
    else if(k==='melon')drawPult(t,rec,'#8fd44e','#3f7a2a','mel');
  }
  ctx.restore();
  // 南瓜壳叠加(套在植物外)
  if(p.shell>0)drawPumpkinOverlay(p,t);
}
function leaf(x,y,rot,col){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(10,0,12,5,0,0,TAU);ctx.fill();ctx.restore();}
function face(x,y,r){
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-4.5,y,3.2,0,TAU);ctx.arc(x+4.5,y,3.2,0,TAU);ctx.fill();

function drawShroomHead(t,c1,r,big){

function drawSunShroom(p,t){

function drawGraveBuster(p,t){

function drawDoom(p,t){

function drawThreepeater(t,rec){

function drawSquash(p,t){

function drawZombie(z){

  ctx.scale(sc,sc);
  const t=visT+z.ph;
  const moving=!z.eat&&!(z.garg&&z.smash>0)&&z.stun<=0;
  const w=Math.sin(t*5.4)*(moving?1:0.12);
  const bob=moving?Math.abs(Math.sin(t*5.4))*2.4:0;
  const eating=z.eat;
  const skin=z.garg?'#8fa568':'#a9b97e',skinD=z.garg?'#748a52':'#8ba168';
  // 水行: 半身

      if(SAVE.done[idx])b.classList.add('done');
      if(!unlocked)b.classList.add('lock');
      b.textContent=unlocked?`${wi+1}-${li+1}`:'🔒';
      if(unlocked)b.onclick=()=>openSeeds(idx);
      row.appendChild(b);
    }
    div.appendChild(row);box.appendChild(div);
  });
}
// ---- 选卡
let pick={list:[],max:6,base:null,levelIdx:0};
function openSeeds(idx){
  scene='seeds';pick={list:[],max:WORLDS[idx/5|0].slots,base:null,levelIdx:idx};
  const w=WORLDS[idx/5|0];
  if(w.rows.includes('w'))pick.base='lily';
  if(w.roof)pick.base='pot';
  pick.list=pick.base?[pick.base]:[];
  showPanel('seeds');
  $('seedTitle').textContent=`${w.short} 第${idx%5+1}关 · 选择你的种子 (最多${pick.max}种)`;
  refreshSeeds();
}
function refreshSeeds(){
  const grid=$('seedGrid');grid.innerHTML='';
  const avail=Object.keys(PD).filter(k=>SAVE.unlocked.includes(k));
  if(pick.base&&!avail.includes(pick.base))avail.push(pick.base);
  for(const k of avail){
    const b=document.createElement('button');b.className='pk';
    const d=PD[k];
    if(d.night&&!WORLDS[pick.levelIdx/5|0].night){b.classList.add('locked');b.title='蘑菇只在黑夜世界清醒';}
    if(pick.list.includes(k))b.classList.add('picked');
    b.innerHTML=`<img src="${iconURL(k)}"><span>${d.name} ${d.cost}</span>`;
    b.onclick=()=>{
      const nightBan=d.night&&!WORLDS[pick.levelIdx/5|0].night;
      if(nightBan||k===pick.base){SFX.deny();return;}
      const i=pick.list.indexOf(k);
      if(i>=0)pick.list.splice(i,1);
      else{if(pick.list.length>=pick.max){SFX.deny();return;}pick.list.push(k);}
      SFX.sel();refreshSeeds();
    };
    grid.appendChild(b);
  }
  const row=$('slotRow');row.innerHTML='';
  for(let i=0;i<pick.max;i++){
    const s=document.createElement('button');s.className='slot'+(i===0&&pick.base?' req':'');
    const k=pick.list[i];
    if(k)s.innerHTML=`<img src="${iconURL(k)}">`+(k===pick.base?'':''),s.onclick=()=>{if(k!==pick.base){pick.list.splice(i,1);refreshSeeds();}};
    else s.innerHTML='<span>+</span>';
    row.appendChild(s);
  }
  $('fightBtn').disabled=pick.list.length===0;
}
function beginLevel(){
  const idx=pick.levelIdx;
  LD=levelDef(idx);reset();S.seed=pick.list.slice();
  scene='playing';paused=false;showPanel(null);
  banner('准备种植物！',2.2);
  bgm.on=true;bgm.step=0;bgm.next=0;bgm.wi=LD.wi;
  // 世界开场白
  if(idx%5===0&&!SAVE.dave[idx]){
    SAVE.dave[idx]=1;storeSave();
    $('daveText').textContent=LD.w.dave;
    $('dave').classList.remove('hidden');
  }
}
function showEnd(){
  S.endShown=true;
  const win=S.over===1;
  $('endTitle').textContent=win?'🌻 胜 利！':'🧟 僵尸吃掉了你的脑子！';
  $('endTitle').style.color=win?'#ffe14d':'#ff5a4a';
  $('endText').textContent=win?`用时 ${Math.floor(S.t)} 秒 · 击杀僵尸 ${S.kills} 只`:`防线被突破了…… 击杀僵尸 ${S.kills} 只`;
  const cards=$('endCards');cards.innerHTML='';
  if(win){
    SAVE.done[LD.idx]=true;
    const rewards=PUNLOCK[LD.idx]||[];
    for(const k of rewards){
      if(!SAVE.unlocked.includes(k))SAVE.unlocked.push(k);
      if(!SAVE.seenP[k])SAVE.seenP[k]=1;
      cards.innerHTML+=`<div class="newCard"><img src="${iconURL(k)}"><div style="font-weight:700;color:#5a3a16">${PD[k].name}</div><div style="font-size:12px;color:#8a6a3a">新植物已解锁！</div></div>`;
    }
    if(!rewards.length)cards.innerHTML=`<div class="newCard"><div class="trophy">🏆</div><div style="font-weight:700;color:#5a3a16">完美通关！</div></div>`;
    SAVE.lv=Math.max(SAVE.lv,LD.idx+1);
    storeSave();SFX.fanfare();
  }
  $('nextBtn').classList.toggle('hidden',!(win&&LD.idx<24));
  $('end').classList.remove('hidden');
}
// ---- 图鉴
let almTab='p',almSel=null;
function openAlmanac(){scene='almanac';showPanel('almanac');refreshAlm();}
function refreshAlm(){
  $('tabP').classList.toggle('on',almTab==='p');
  $('tabZ').classList.toggle('on',almTab==='z');
  const grid=$('almGrid');grid.innerHTML='';
  const reg=almTab==='p'?PD:ZD;
  for(const k of Object.keys(reg)){
    const seen=almTab==='p'?(SAVE.unlocked.includes(k)||SAVE.seenP[k]):SAVE.seenZ[k];
    const d=document.createElement('button');d.className='alm'+(seen?'':' lock');
    d.innerHTML=`<img src="${iconURL(k,almTab==='z')}">`;
    if(seen)d.onclick=()=>{almSel=k;refreshAlm();};
    grid.appendChild(d);
  }
  const det=$('almDetail');
  if(!almSel){det.innerHTML='<div>点击条目查看详情</div>';return;}
  const d=reg[almSel];
  const seen=almTab==='p'?(SAVE.unlocked.includes(almSel)||SAVE.seenP[almSel]):SAVE.seenZ[almSel];
  if(!seen){det.innerHTML='<div>???（尚未遇见）</div>';return;}
  det.innerHTML=`<img src="${iconURL(almSel,almTab==='z')}"><div><div class="nm">${d.name}</div><div class="st">${d.st}</div><div class="fl">${d.fl}</div></div>`;
}
// ---- 按钮绑定
$('advBtn').onclick=()=>{ac();const idx=Math.min(24,SAVE.lv);openSeeds(idx);};
$('almBtn').onclick=()=>{ac();openAlmanac();};
$('resetBtn').onclick=()=>{if(confirm('确定重置全部冒险进度？')){SAVE={lv:0,unlocked:['peashooter'],done:{},seenP:{peashooter:1},seenZ:{},dave:{}};storeSave();refreshMenu();}};
$('backBtn').onclick=()=>toMenu();
$('seedBack').onclick=()=>{scene='levels';openLevels();};
$('fightBtn').onclick=()=>{ac();beginLevel();};
$('tabP').onclick=()=>{almTab='p';almSel=null;refreshAlm();};
$('tabZ').onclick=()=>{almTab='z';almSel=null;refreshAlm();};
$('almBack').onclick=()=>toMenu();
$('daveOk').onclick=()=>{$('dave').classList.add('hidden');};
$('againBtn').onclick=()=>{ac();beginLevel();};
$('nextBtn').onclick=()=>{ac();openSeeds(Math.min(24,LD.idx+1));};
$('menuBtn').onclick=()=>openLevels();

// ============================================================ 输入
function evPos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
cv.addEventListener('pointermove',e=>{if(!S)return;const p=evPos(e);S.mx=p.x;S.my=p.y;});
cv.addEventListener('contextmenu',e=>{e.preventDefault();if(S){S.sel=null;S.shovel=false;}});
cv.addEventListener('pointerdown',e=>{
  ac();
  if(scene!=='playing'||!S||S.over)return;
  if(e.button===2){S.sel=null;S.shovel=false;return;}
  const{x,y}=evPos(e);
  if(Math.hypot(x-BTN_MUTE.x,y-BTN_MUTE.y)<BTN_MUTE.r+4){muted=!muted;return;}
  if(Math.hypot(x-BTN_PAUSE.x,y-BTN_PAUSE.y)<BTN_PAUSE.r+4){togglePause();return;}
  if(paused)return;
  // 阳光(优先于种子栏, 阳光可能落在顶栏附近)
  for(let i=S.suns.length-1;i>=0;i--){const su=S.suns[i];
    if(!su.fly&&Math.hypot(x-su.x,y-su.y)<42){su.fly=true;SFX.sunPick();return;}}
  if(y<90){
    for(let i=0;i<S.seed.length;i++){
      const px=112+i*70;
      if(x>=px&&x<=px+64){
        const k=S.seed[i],d=PD[k],cd=S.cds[k]||0;
        if(S.sel===k){S.sel=null;return;}
        if(S.sun>=d.cost&&cd<=0){S.sel=k;S.shovel=false;SFX.sel();}
        else SFX.deny();
        return;
      }
    }
    if(x>=SHOV.x&&x<=SHOV.x+SHOV.w){S.shovel=!S.shovel;S.sel=null;SFX.sel();return;}
    return;
  }
  const cell=cellAt(x,y);
  if(cell){
    if(S.shovel){
      const p=plantAt(cell.r,cell.c)||baseAt(cell.r,cell.c);
      if(p&&p.kind!=='pumpkin'){p.rm=true;leafBurst(p);SFX.dig();S.shovel=false;}
      else if(p&&p.kind==='pumpkin'){}
      return;
    }
    if(S.sel){
      const k=S.sel,v=canPlace(k,cell.r,cell.c);
      if(v==='ok'){
        if(k==='pumpkin'){attachPumpkin(cell.r,cell.c);}
        else{placePlant(k,cell.r,cell.c,false);}
        S.sel=null;
      }else SFX.deny();
    }
  }
});
addEventListener('keydown',e=>{
  const key=e.key.toLowerCase();
  if(scene==='playing'&&S){
    if(key==='escape'){S.sel=null;S.shovel=false;}
    if(key==='p')togglePause();
    if(key>='1'&&key<='9'&&!S.over&&!paused){
      const k=S.seed[+key-1];
      if(k){const d=PD[k],cd=S.cds[k]||0;
        if(S.sun>=d.cost&&cd<=0){S.sel=k;S.shovel=false;SFX.sel();}else SFX.deny();}
    }
  }
  if(key==='m')muted=!muted;
  if(key==='r'&&scene==='playing'&&S.over)beginLevel();
});
function togglePause(){if(!S||S.over)return;paused=!paused;bgm.on=!paused;$('pauseTip').classList.toggle('hidden',!paused);}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scene==='playing'&&!paused&&!S.over)togglePause();});

// ============================================================ 主循环与测试钩子
bakeWorlds();
LD=levelDef(0);reset();scene='menu';
function loop(ts){
  const dt=Math.min((ts-last)/1000,0.05);last=ts;
  visT+=dt;
  try{
    if(scene==='playing'&&!paused&&S&&$('dave').classList.contains('hidden'))update(dt);
    render();
  }catch(err){
    if(window.__errs)window.__errs.push('loop: '+String(err&&err.message||err));
    console.error(err);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(t=>{last=t;requestAnimationFrame(loop);});
window.__pvz={
  pump(n,dt){n=n||1;dt=dt||0.05;for(let i=0;i<n;i++){if(scene==='playing'&&!paused&&S)update(dt);}render();return this.s;},
  get dbg(){return {scene,paused,overT:S&&Math.round(S.overT*10)/10};},
  get graves(){return S?S.graves.map(g=>({r:g.r,c:g.c})):null;},
  get suns(){return S?S.suns.map(s=>({x:Math.round(s.x),y:Math.round(s.y),land:s.land,fly:s.fly,val:s.val})):null;},
  get s(){return S?{t:Math.round(S.t),sun:S.sun,plants:S.plants.length,z:S.zombies.length,wave:S.waveI+'/'+S.waves.length,over:S.over,lv:LD.idx}:null;},
  get save(){return JSON.parse(JSON.stringify(SAVE));},
  give(n){if(S)S.sun+=n;},
  skip(sec){if(scene==='playing'&&S&&!S.over)for(let i=0;i<Math.round(sec*10);i++)update(0.1);},
  plant(k,r,c){if(scene==='playing'&&canPlace(k,r,c)==='ok')placePlant(k,r,c,true);},
  spawn(type,row){if(scene==='playing')return spawnZombie(type,row);},
  killAll(){if(!S)return;S.spawnQ=[];S.waveI=S.waves.length;S.zombies.forEach(z=>{if(!z.dead)killZ(z);});},
  start(idx){LD=levelDef(idx);reset();S.seed=['peashooter','sunflower','wallnut','snowpea','chomper','potato'];scene='playing';paused=false;showPanel(null);banner('准备种植物！',2);bgm.on=true;bgm.wi=LD.wi;},
  unlockAll(){for(const k of Object.keys(PD))if(!SAVE.unlocked.includes(k))SAVE.unlocked.push(k);for(const k of Object.keys(ZD))SAVE.seenZ[k]=1;storeSave();},
  garden(){if(!S)return;const ks=Object.keys(PD);let r=0,c=0;for(const k of ks){if(c>=COLS){c=0;r++;}if(r>=LD.ROWS)break;
      const keep=S.sun;S.sun=99999;if(canPlace(k,r,c)==='ok')placePlant(k,r,c,true);if(canPlace('lily',r,c)==='ok')placePlant('lily',r,c,true);S.sun=keep;c++;}},
  parade(){if(!S)return;const ks=Object.keys(ZD);ks.forEach((k,i)=>{const z=spawnZombie(k,i%LD.ROWS);z.x=W-120-(i*0|0);});const zs=S.zombies.slice(-ks.length);zs.forEach((z,i)=>z.x=GX+3*CW+i*76);},
};
</script>
