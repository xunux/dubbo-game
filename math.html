<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>数学勇者：真理之光</title>
<link rel="icon" href="data:,">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0d160b;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
#wrap{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0;background:#141f10;overflow:hidden;box-shadow:0 0 60px #000}
canvas#cv{position:absolute;left:0;top:0}
#ui{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#ui>*{pointer-events:auto}
.hidden{display:none!important}
/* ===== 通用面板与按钮（延续门户木牌基因） ===== */
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(18,30,14,.96);
  border:4px solid #8a5a2a;border-radius:18px;box-shadow:0 10px 0 #3a2508,0 0 50px rgba(0,0,0,.6);
  padding:26px 34px;color:#f4ecd8;text-align:center;max-height:660px;overflow:auto}
.panel h1{font-size:44px;font-weight:900;color:#ffe14d;text-shadow:0 3px 0 #4a2c07,0 0 24px rgba(255,225,77,.35);letter-spacing:2px}
.panel h2{font-size:28px;font-weight:900;color:#ffe14d;text-shadow:0 2px 0 #4a2c07;margin-bottom:12px}
.panel .sub{color:#cdbf9a;font-size:15px;margin:6px 0 18px}
.btn{display:inline-block;cursor:pointer;border:none;outline:none;font-family:inherit;
  background:linear-gradient(180deg,#9ade54,#55a326);color:#1c3a06;font-size:20px;font-weight:900;
  padding:12px 34px;border-radius:14px;box-shadow:0 5px 0 #33691e,0 6px 12px rgba(0,0,0,.4);
  text-shadow:0 1px 0 rgba(255,255,255,.4);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 #33691e,0 10px 16px rgba(0,0,0,.45)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #33691e}
.btn.dim{background:linear-gradient(180deg,#b9a98a,#8a7a5c);color:#3a2f1c;box-shadow:0 5px 0 #5a4d34;cursor:default}
.btn.warn{background:linear-gradient(180deg,#ffb35e,#e07818);box-shadow:0 5px 0 #9c520c;color:#4a2404}
.btn.small{font-size:15px;padding:8px 18px;border-radius:10px}
.menu-btns .btn{display:block;margin:12px auto;min-width:300px}
.gold-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.4);border:2px solid #8a5a2a;
  border-radius:999px;padding:4px 14px;color:#ffd94d;font-weight:900;font-size:16px}
/* ===== 世界地图 ===== */
#map .map-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
#map .map-head .title-chip{background:rgba(0,0,0,.35);border-radius:10px;padding:6px 14px;font-weight:900;color:#ffe14d;font-size:17px;border:2px solid #6a4a1a}
#mapWorlds{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-width:900px}
.wcard{background:linear-gradient(180deg,rgba(255,249,226,.08),rgba(0,0,0,.25));border:2px solid #6a4a1a;border-radius:12px;padding:10px 12px;text-align:left}
.wcard .wname{font-weight:900;font-size:17px;color:#ffe14d;display:flex;justify-content:space-between;align-items:center}
.wcard .wname .grade{font-size:12px;color:#cdbf9a;font-weight:700;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:6px}
.wcard .lvls{display:flex;gap:6px;margin-top:8px}
.lvbtn{flex:1;cursor:pointer;text-align:center;border-radius:9px;padding:7px 0 5px;font-weight:900;color:#fff;
  background:linear-gradient(180deg,#7fc34a,#4a8a24);box-shadow:0 3px 0 #2f5a15;font-size:15px;border:none;font-family:inherit}
.lvbtn .stars{font-size:11px;color:#ffe97a;letter-spacing:-1px;height:13px}
.lvbtn.locked{background:linear-gradient(180deg,#5c6653,#3d453a);box-shadow:0 3px 0 #262c22;color:#9aa793;cursor:default}
.lvbtn.cur{animation:pulse 1.2s infinite}
.lvbtn.boss{background:linear-gradient(180deg,#e08a5e,#b04a1c);box-shadow:0 3px 0 #6e2c0a}
.lvbtn.boss.locked{background:linear-gradient(180deg,#66575a,#463a3e);box-shadow:0 3px 0 #2c2427;color:#a79599}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.45)}}
/* ===== 商店 ===== */
#shop .rows{min-width:640px;text-align:left}
.shoprow{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.28);border:2px solid #5a4a26;border-radius:12px;padding:10px 14px;margin-bottom:10px}
.shoprow .ico{font-size:30px;width:44px;text-align:center}
.shoprow .info{flex:1}
.shoprow .nm{font-weight:900;font-size:17px;color:#ffe14d}
.shoprow .ds{font-size:13px;color:#cdbf9a;margin-top:2px}
.shoprow .dots{display:flex;gap:5px;margin-top:6px}
.shoprow .dots i{width:22px;height:8px;border-radius:4px;background:#3d453a;display:block}
.shoprow .dots i.on{background:#9ade54;box-shadow:0 0 6px #9ade54}
/* ===== 错题本 ===== */
#book .rows{min-width:600px;max-height:420px;overflow:auto;text-align:left}
.brow{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.28);border:2px solid #5a4a26;border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:15px}
.brow .tag{background:#7a3a1a;color:#ffd9c9;font-size:12px;font-weight:900;border-radius:6px;padding:3px 8px;flex-shrink:0}
.brow .qq{flex:1;color:#f4ecd8}
.brow .aa{color:#9ade54;font-weight:900}
/* ===== 结算 ===== */
#result .stars{font-size:64px;letter-spacing:6px;margin:6px 0 2px;text-shadow:0 4px 8px rgba(0,0,0,.6)}
#result .stars .st{display:inline-block;opacity:.22;transform:scale(.6)}
#result .stars .st.on{opacity:1;transform:scale(1);animation:starpop .45s cubic-bezier(.2,2.4,.4,1) forwards}
@keyframes starpop{from{opacity:0;transform:scale(2.2) rotate(30deg)}to{opacity:1;transform:scale(1) rotate(0)}}
#result .stat{font-size:17px;color:#e8dfc6;margin:4px 0}
#result .lvup{display:none;margin:10px auto;padding:10px 22px;background:linear-gradient(180deg,rgba(154,222,84,.25),rgba(85,163,38,.12));
  border:2px solid #9ade54;border-radius:12px;color:#c9f79a;font-weight:900;font-size:19px;animation:starpop .5s cubic-bezier(.2,2.4,.4,1)}
/* ===== 答题输入 ===== */
#pad{position:absolute;right:22px;bottom:16px;width:308px;background:rgba(14,24,10,.88);border:3px solid #8a5a2a;border-radius:16px;padding:12px;box-shadow:0 8px 0 #3a2508}
#padDisp{background:rgba(0,0,0,.5);border:2px solid #5a4a26;border-radius:10px;height:52px;line-height:48px;
  color:#9ade54;font-size:30px;font-weight:900;text-align:center;margin-bottom:10px;overflow:hidden;white-space:nowrap}
#padDisp.err{color:#ff7a5e;border-color:#a03a22}
#padGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk{cursor:pointer;border:none;font-family:inherit;background:linear-gradient(180deg,#e8dcb8,#c9b988);color:#3a2c0a;
  font-size:22px;font-weight:900;border-radius:10px;padding:9px 0;box-shadow:0 3px 0 #8a7a4c}
.pk:active{transform:translateY(2px);box-shadow:0 1px 0 #8a7a4c}
.pk.op{background:linear-gradient(180deg,#f0c98a,#d8a45c)}
.pk.go{background:linear-gradient(180deg,#9ade54,#55a326);color:#1c3a06;box-shadow:0 3px 0 #33691e}
.pk.wide{grid-column:span 2}
#choices{position:absolute;right:22px;bottom:16px;width:390px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chbtn{cursor:pointer;border:3px solid #8a5a2a;font-family:inherit;background:linear-gradient(180deg,#e8dcb8,#c9b988);
  color:#3a2c0a;font-size:24px;font-weight:900;border-radius:14px;padding:20px 6px;box-shadow:0 5px 0 #8a7a4c;transition:transform .08s}
.chbtn:hover{transform:translateY(-2px)}
.chbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #8a7a4c}
.chbtn.ok{background:linear-gradient(180deg,#9ade54,#55a326);color:#123102}
.chbtn.no{background:linear-gradient(180deg,#e08a5e,#b04a1c);color:#4a1c04}
.chkey{display:block;font-size:12px;color:#7a6a3a;margin-bottom:3px}
/* ===== 剧情/结局/暂停 ===== */
#story .wbadge{font-size:15px;font-weight:900;color:#0d160b;background:#ffe14d;border-radius:999px;display:inline-block;padding:5px 18px;margin-bottom:14px}
#story .stext{font-size:19px;line-height:1.9;color:#f4ecd8;max-width:560px;margin:0 auto 20px}
#ending .tro{font-size:70px;animation:starpop .6s cubic-bezier(.2,2.4,.4,1)}
/* ===== 提示气泡 ===== */
#toast{position:absolute;left:50%;top:86px;transform:translateX(-50%);background:rgba(20,32,16,.95);border:3px solid #8a5a2a;
  border-radius:12px;padding:10px 26px;color:#ffe14d;font-weight:900;font-size:17px;box-shadow:0 6px 0 #3a2508;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
#toast.show{opacity:1}
@media (max-width:760px){
  .panel{padding:16px 14px;max-height:86vh}
  .panel h1{font-size:30px}
  #mapWorlds{grid-template-columns:1fr 1fr;min-width:0}
  .wcard .lvls{flex-wrap:wrap}
}
/* 窄屏：答题控件脱离画布缩放，固定到视口，保证触控目标大小 */
body>#pad.mobile-pad{position:fixed;right:10px;bottom:10px;width:min(56vw,320px);z-index:60;transform:none}
body>#pad.mobile-pad #padDisp{font-size:clamp(20px,6vw,30px);height:56px;line-height:52px}
body>#pad.mobile-pad .pk{font-size:clamp(18px,5.6vw,26px);padding:clamp(8px,2.6vw,13px) 0}
body>#pad.mobile-pad .pk.go{grid-column:span 3}
body>#choices.mobile-pad{position:fixed;right:10px;bottom:10px;width:min(64vw,360px);grid-template-columns:1fr 1fr;z-index:60;gap:8px;transform:none}
body>#choices.mobile-pad .chbtn{font-size:clamp(15px,4.6vw,24px);padding:clamp(12px,4vw,22px) 4px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="ui">
    <!-- 战斗内答题控件 -->
    <div id="pad" class="hidden">
      <div id="padDisp"></div>
      <div id="padGrid">
        <button class="pk" data-k="7">7</button><button class="pk" data-k="8">8</button><button class="pk" data-k="9">9</button>
        <button class="pk" data-k="4">4</button><button class="pk" data-k="5">5</button><button class="pk" data-k="6">6</button>
        <button class="pk" data-k="1">1</button><button class="pk" data-k="2">2</button><button class="pk" data-k="3">3</button>
        <button class="pk op" data-k="-">−</button><button class="pk" data-k="0">0</button><button class="pk op" data-k=".">.</button>
        <button class="pk op wide" data-k="/">⁄分数</button><button class="pk op" data-k="B">⌫</button>
        <button class="pk go" data-k="S" style="grid-column:span 3">确认作答 ⏎</button>
      </div>
    </div>
    <div id="choices" class="hidden"></div>

    <!-- 主菜单 -->
    <div id="menu" class="panel" style="min-width:480px">
      <h1>⚔ 数学勇者</h1>
      <div class="sub" style="font-size:21px;color:#ffe14d;margin-bottom:4px">真 理 之 光</div>
      <div class="sub">数字大陆被混沌侵蚀——用算力法杖答题施法，闯过 9 大世界 36 关，从一年级一路修炼到数学大师！</div>
      <div class="menu-btns">
        <button class="btn" id="btnContinue">▶ 开始冒险</button>
        <button class="btn dim hidden" id="btnEndless">♾ 无尽模式</button>
        <button class="btn warn" id="btnBook">📖 错题本</button>
        <button class="btn warn" id="btnShopMenu">🛠 强化工坊</button>
      </div>
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:center">
        <button class="btn small" id="btnSfx">🔊 音效：开</button>
        <button class="btn small" id="btnBgm">🎵 音乐：开</button>
        <button class="btn small warn" id="btnReset">🗑 重置进度</button>
        <button class="btn small warn" id="btnPortal">🚪 退出游戏</button>
      </div>
      <div class="sub" style="margin-top:14px;font-size:13px">键盘输入数字 · 回车提交 · 选择题按 1-4 · Esc 或左下 ⏸ 暂停</div>
    </div>

    <!-- 世界地图 -->
    <div id="map" class="panel" style="min-width:960px">
      <div class="map-head">
        <span class="title-chip" id="heroChip">Lv.1 数字学徒</span>
        <span class="gold-tag">🪙 <span id="mapGold">0</span></span>
        <button class="btn small hidden" id="btnEndlessMap">♾ 无尽模式</button>
        <button class="btn small" id="btnShop">🛠 强化工坊</button>
        <button class="btn small warn" id="btnBook2">📖 错题本</button>
        <button class="btn small dim" id="btnBackMenu">☰ 主菜单</button>
      </div>
      <div id="mapWorlds"></div>
    </div>

    <!-- 强化工坊 -->
    <div id="shop" class="panel">
      <h2>🛠 强化工坊</h2>
      <div class="sub">用金币强化勇者，让答题之旅更从容 <span class="gold-tag" style="margin-left:10px">🪙 <span id="shopGold">0</span></span></div>
      <div class="rows" id="shopRows"></div>
      <button class="btn" id="btnShopBack">返 回 地 图</button>
    </div>

    <!-- 错题本 -->
    <div id="book" class="panel">
      <h2>📖 错题本</h2>
      <div class="sub" id="bookSub">答错的题目会记录在这里，复习后再出发吧！</div>
      <div class="rows" id="bookRows"></div>
      <div style="display:flex;gap:12px;justify-content:center">
        <button class="btn warn" id="btnBookClear">清空错题</button>
        <button class="btn" id="btnBookBack">返 回</button>
      </div>
    </div>

    <!-- 关卡结算 -->
    <div id="result" class="panel" style="min-width:460px">
      <h2 id="resTitle">关卡通过！</h2>
      <div class="stars"><span class="st">★</span><span class="st">★</span><span class="st">★</span></div>
      <div class="stat" id="resStat1"></div>
      <div class="stat" id="resStat2"></div>
      <div class="lvup" id="resLvup"></div>
      <div style="margin-top:14px;display:flex;gap:12px;justify-content:center">
        <button class="btn" id="btnNext">下一关 ▶</button>
        <button class="btn warn" id="btnRetry">再试一次</button>
        <button class="btn dim" id="btnToMap">返回地图</button>
      </div>
    </div>

    <!-- 世界剧情 -->
    <div id="story" class="panel" style="min-width:520px">
      <div class="wbadge" id="storyBadge">世界一 · 数字森林</div>
      <h2 id="storyTitle">迷雾笼罩的森林</h2>
      <div class="stext" id="storyText"></div>
      <button class="btn" id="btnStoryGo">出 发！</button>
    </div>

    <!-- 通关结局 -->
    <div id="ending" class="panel" style="min-width:560px">
      <div class="tro">🏆</div>
      <h1 style="font-size:38px">真理之光重燃！</h1>
      <div class="stext" id="endText"></div>
      <div style="display:flex;gap:12px;justify-content:center">
        <button class="btn" id="btnEndless2">♾ 进入无尽模式</button>
        <button class="btn dim" id="btnEndMap">返回地图</button>
      </div>
    </div>

    <!-- 暂停 -->
    <div id="pause" class="panel">
      <h2>⏸ 暂停</h2>
      <div class="menu-btns">
        <button class="btn" id="btnResume">▶ 继续战斗</button>
        <button class="btn warn" id="btnRestart">↺ 重新开始本关</button>
        <button class="btn dim" id="btnQuit">✖ 退出关卡</button>
      </div>
    </div>

    <!-- 战斗内常驻退出按钮（触屏也能暂停/退出） -->
    <button id="btnExit" class="btn small warn hidden" style="position:absolute;left:18px;bottom:14px;pointer-events:auto">⏸ 暂停 / 退出</button>

    <div id="toast"></div>
  </div>
</div>
<script>
'use strict';
window.__bootErr = [];
window.addEventListener('error', function (e) { window.__bootErr.push(String(e.message || e)); });

// ============================================================
//  基础工具
// ============================================================
const CV = document.getElementById('cv'), CTX = CV.getContext('2d');
const Wd = 1280, Ht = 720;
const $ = id => document.getElementById(id);
const show = (id, on) => $(id).classList.toggle('hidden', !on);
function ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
const SUPO = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
function sup(n) { return String(n).split('').map(c => SUPO[c] || c).join(''); }
function fmt(n) { // 数字转整洁字符串（去多余小数尾零）
  if (Number.isInteger(n)) return String(n);
  return String(parseFloat(n.toFixed(6)));
}
function toast(msg, ms) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms || 1600);
}

// ============================================================
//  存档
// ============================================================
const SAVE_KEY = 'math_save_v1';
function defSave() {
  return { v: 1, lv: 1, stars: {}, gold: 0, up: { hp: 0, sh: 0, t: 0, cb: 0, g: 0 }, wrong: [], set: { sfx: 1, bgm: 1 }, endBest: 0, seenW: 0 };
}
let SV = defSave();
function loadSave() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (d && d.v === 1) {
      const base = defSave();
      SV = Object.assign(base, d);
      SV.up = Object.assign(base.up, d.up || {});
      SV.set = Object.assign(base.set, d.set || {});
      SV.wrong = Array.isArray(d.wrong) ? d.wrong : [];
      SV.stars = d.stars || {};
    }
  } catch (e) { /* 存档损坏则重置 */ }
}
function storeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SV)); } catch (e) { } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } SV = defSave(); }
loadSave();
// 派生数值（由强化等级计算）
function heroMaxHp() { return 100 + SV.up.hp * 20; }
function startShields() { return SV.up.sh; }
function bonusTime() { return SV.up.t * 2; }
function comboNeed() { return [5, 4, 3][SV.up.cb]; }
function goldMult() { return 1 + SV.up.g * 0.25; }
function heroTitle(lv) { return TITLES[clamp(Math.ceil(lv / 4) - 1, 0, 8)]; }
const TITLES = ['数字学徒', '算术行者', '分数猎手', '大数领主', '方程术士', '比例贤者', '有理数骑士', '函数法师', '数学大师'];

// ============================================================
//  音频（WebAudio 程序化，无资源文件）
// ============================================================
let AC = null, BGM = { timer: 0, on: false, step: 0, next: 0 };
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f0, f1, dur, type, vol, when, dest) {
  const c = ac(); if (!c) return;
  const t = c.currentTime + (when || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || c.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, when) {
  const c = ac(); if (!c) return;
  const t = c.currentTime + (when || 0);
  const len = Math.max(1, (dur * c.sampleRate) | 0);
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);

const G = {}; // 生成器注册表：id -> () => 题目对象
function reg(id, fn) { G[id] = fn; }
// 题目对象：{t:题面, k:'in'|'ch', a:答案(输入题为字符串/选择题为下标), o:选项数组}
function Q(t, a, h) { return { t: String(t), k: 'in', a: String(a), h: h || '' }; }
function QC(t, a, ws, h) {
  const opts = [String(a)];
  for (const w of (ws || [])) { const s = String(w); if (!opts.includes(s)) opts.push(s); }
  const sh = shuffle(opts);
  return { t: String(t), k: 'ch', a: sh.indexOf(String(a)), o: sh, h: h || '' };
}
// 分数约分显示：fracStr(6,8)='3/4'；整数直接显示
function fracStr(n, d) {
  if (d < 0) { n = -n; d = -d; }
  const g = gcd(n, d); n = Math.round(n / g); d = Math.round(d / g);
  if (d === 1) return String(n);
  return n + '/' + d;
}

function term(c, v) { // 组装多项式项：c=0 省略，正数带 +
  if (c === 0) return '';
  const sign = c > 0 ? ' + ' : ' − ';
  return sign + Math.abs(c) + v;
}
reg('quad', () => {
  let r1 = ri(-9, 9), r2 = ri(-9, 9);
  if (r1 === r2) r2 = r2 === 9 ? -9 : r2 + 1;
  const b = -(r1 + r2), c = r1 * r2;
  const hi = Math.max(r1, r2), lo = Math.min(r1, r2);
  return Math.random() < 0.5
    ? Q(`解方程：x²${term(b, '')}${term(c, '')} = 0 ，较大的根 x = ?`, hi)
    : Q(`解方程：x²${term(b, '')}${term(c, '')} = 0 ，较小的根 x = ?`, lo);
});
reg('quad2', () => {
  const kind = pick(['two', 'two', 'one', 'none']); // 判别式>0/＝0/<0，直接构造保证标签正确
  const opts = ['有两个不相等的实数根', '有两个相等的实数根', '没有实数根'];
  if (kind === 'none') {
    const c = ri(1, 6);
    return QC(`一元二次方程 x² + ${c} = 0 的根的情况是？`, '没有实数根', opts.filter(o => o !== '没有实数根'));
  }
  if (kind === 'one') {

    return QC(`一元二次方程 x²${term(b, '')}${term(c, '')} = 0 的根的情况是？`, '有两个相等的实数根', opts.filter(o => o !== '有两个相等的实数根'));
  }
  let r1 = ri(-6, 6), r2 = ri(-6, 6);
  if (r1 === r2) r2 = r2 === 6 ? -6 : r2 + 1;
  const b = -(r1 + r2), c = r1 * r2;
  return QC(`一元二次方程 x²${term(b, '')}${term(c, '')} = 0 的根的情况是？`, '有两个不相等的实数根', opts.filter(o => o !== '有两个不相等的实数根'));
});

function parseNum(s) {
  if (s == null) return null;
  s = String(s).trim().replace(/−/g, '-').replace(/，/g, '').replace(/\s+/g, '');
  if (s === '') return null;
  let m = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if (m) { const b = parseFloat(m[2]); if (!b) return null; return parseFloat(m[1]) / b; }
  m = s.match(/^[+-]?(\d+\.?\d*|\.\d+)$/);
  if (m) return parseFloat(s);
  return null;
}
function isRight(q, raw) {
  if (q.k === 'ch') return String(raw) === String(q.a);
  const v = parseNum(raw), a = parseNum(q.a);
  return v !== null && a !== null && Math.abs(v - a) < 1e-6;
}
function ansText(q) { return q.k === 'ch' ? q.o[q.a] : q.a; }

// 生成一道题（避免与上一题同源，带形状校验）
function makeQ(pool, lastSrc) {
  for (let i = 0; i < 8; i++) {
    const id = pool.length > 1 && lastSrc ? pick(pool.filter(g => g !== lastSrc)) : pick(pool);
    const fn = G[id];
    if (!fn) continue;
    let q = null;
    try { q = fn(); } catch (e) { q = null; }
    if (!q || typeof q.t !== 'string' || !q.t) continue;
    if (q.k === 'ch') { if (!Array.isArray(q.o) || q.o.length < 2 || q.a < 0 || q.a >= q.o.length) continue; }
    else { if (parseNum(q.a) === null) continue; q.k = 'in'; }
    q.src = id;
    return q;
  }
  return Q('1 + 1 = ?', 2);
}

function endlessWorld() { return WORLDS[Math.floor(B.streak / 5) % 9]; }

function currentQ() { return B.qs[B.qi]; }

function pushQ() {
  let pool;
  if (B.endless) pool = allGens().concat(['prob9', 'rot9']);
  else if (B.L.boss) pool = B.n === 36 ? B.L.gens.concat(['prob9', 'rot9']) : B.L.gens;
  else pool = B.L.gens;
  B.qs.push(makeQ(pool, B.lastSrc));
  B.lastSrc = B.qs[B.qs.length - 1].src;
}

function nextEnemy() {
  if (B.over) return;
  if (!B.endless && !B.L.boss && B.qi + 1 >= B.L.n) { victory(); return; }
  B.qi++;
  if (B.qi >= B.qs.length) pushQ();
  const q = currentQ();
  B.inVal = '';
  B.lock = false; B.phase = 'walk';
  if (B.boss) {
    // BOSS 关：BOSS 常驻，无需新敌人
    B.boss.idleT = 0;
  } else {
    const kinds = B.endless ? endlessWorld().minions : B.w.minions;
    const mk = pick(kinds);
    const tm = B.endless ? clamp(17 - B.streak * 0.12, 9, 20) : (B.L.tm + bonusTime());
    B.enemy = {
      kind: mk, x: SPAWN_X, speed: (SPAWN_X - HIT_X) / tm,
      state: 'walk', t: 0, dieT: 0, hitFlash: 0,
    };
  }
  updateAnswerUI(q);
}

// ============ 作答与结算 ============
function submit(raw) {
  if (!B || B.lock || B.over || VIEW.paused) return;
  const q = currentQ(); if (!q) return;
  const correct = isRight(q, raw);
  if (q.k === 'ch') {
    const btns = $('choices').querySelectorAll('.chbtn');
    btns.forEach((b, i) => {
      b.disabled = true;
      if (i === q.a) b.classList.add('ok');
      if (i === Number(raw) && !correct) b.classList.add('no');
    });
  }
  if (correct) onRight(q); else onWrong(q, raw);
}

function onRight(q) {
  B.right++; B.streak++; B.res[B.qi] = 'r'; B.lastRight = true;
  B.hero.combo++; B.hero.maxCombo = Math.max(B.hero.maxCombo, B.hero.combo);
  B.hero.castT = 0.5; B.lock = true; B.phase = 'cast';

  B.goldRun += g;
}
function bossTarget() {

}

function boom(x, y, color, n) {

  }
}
function addText(x, y, txt, color, size) {
  B.texts.push({ x, y, txt, c: color, s: size || 24, life: 1.1 });
}
function spawnCoins(x, y, n) {

// ============ 主更新 ============
function update(dt) {
  if (!B || VIEW.mode !== 'battle' || VIEW.paused) return;
  B.t += dt; B.ambT += dt;
  if (B.resultT > 0) {
    B.resultT -= dt;
    // 战斗结束演出继续更新粒子
    for (const p of B.parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.grav) p.vy += 460 * dt; }
    B.parts = B.parts.filter(p => p.life > 0);
    for (const t of B.texts) { t.life -= dt; t.y -= 46 * dt; }
    B.texts = B.texts.filter(t => t.life > 0);
    for (const c of B.coins) { c.life -= dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 620 * dt; }
    B.coins = B.coins.filter(c => c.life > 0);
    if (B.resultT <= 0) showResult();
    return;
  }
  if (B.flashT > 0) B.flashT -= dt;
  if (B.shake > 0) B.shake = Math.max(0, B.shake - dt * 40);
  if (B.hero.castT > 0) B.hero.castT -= dt;
  if (B.hero.hurtT > 0) B.hero.hurtT -= dt;
  if (B.endless) { B.w = endlessWorld(); }
  // 火球
  for (const p of B.projs) { p.t += dt; }
  B.projs = B.projs.filter(p => {
    if (p.t >= p.dur) { projHit(); return false; }
    return true;
  });
  // 敌人
  const e = B.enemy;
  if (e && !B.boss) {
    e.hitFlash = Math.max(0, e.hitFlash - dt);
    if (e.state === 'walk') {
      e.x -= e.speed * dt;
      if (e.x <= HIT_X) {
        e.x = HIT_X; e.state = 'atk'; e.t = 0;
        if (!B.lock) { // 超时未作答
          B.wrongCount++; B.streak = 0; B.hero.combo = 0; B.lastRight = false;
          sfx('wrong'); recordWrong(currentQ()); B.res[B.qi] = 'w';
          addText(e.x - 30, GROUND_Y - 210, '超时！', '#ff9e5e', 28);
          B.lock = true; B.lockT = 1.15; B.phase = 'after';
        }
      }
    } else if (e.state === 'atk') {
      e.t += dt;
      if (e.t > 0.45 && !e.struck) { e.struck = true; enemyHitHero(10 + B.L.w * 2); }
      if (e.t > 0.8) { e.state = 'run'; e.t = 0; }
    } else if (e.state === 'run') {
      e.x += 800 * dt;
      if (e.x > SPAWN_X + 90) { B.enemy = null; if (!B.over) nextEnemy(); }
    } else if (e.state === 'die') {
      e.dieT += dt;
      if (e.dieT > 0.5) { B.enemy = null; }
    }
  }
  // BOSS
  if (B.boss && B.phase !== 'bossdie') {
    const bo = B.boss;
    bo.hitFlash = Math.max(0, bo.hitFlash - dt);
    bo.charge = Math.min(1, bo.charge + dt / bo.cd);
    if (bo.charge >= 1) { bo.charge = 0.12; bossStrike(24 + B.L.w * 2); addText(BOSS_X, 260, '💥 混沌冲击！', '#ff7a5e', 34); }
  }
  // 锁定倒计时 → 下一题（等旧敌人清场后再计时，避免敌人原地消失/抢跳下一题）
  if (B.lock && B.phase === 'after') {
    const e0 = B.enemy;
    const busy = e0 && !B.boss && (e0.state === 'atk' || e0.state === 'run');
    if (!busy) {
      B.lockT -= dt;
      if (B.lockT <= 0 && !B.over) nextEnemy();
    }
  }
  // BOSS 死亡演出
  if (B.phase === 'bossdie') {
    B.lockT += dt;
    if (B.lockT > 0.2 && Math.random() < 0.5) boom(BOSS_X + ri(-70, 70), GROUND_Y - ri(20, 160), pick(['#ffb05e', '#ffd94d', '#ff7a5e']));
    B.shake = Math.max(B.shake, 6);
    if (B.lockT > 1.4) victory();
  }
  // 粒子
  for (const p of B.parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.grav) p.vy += 460 * dt; }
  B.parts = B.parts.filter(p => p.life > 0);
  for (const t of B.texts) { t.life -= dt; t.y -= 46 * dt; }
  B.texts = B.texts.filter(t => t.life > 0);
  for (const c of B.coins) { c.life -= dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 620 * dt; }
  B.coins = B.coins.filter(c => c.life > 0);
}

// ============ 输入 ============
function padKey(k) {
  if (!B || B.lock || B.over || VIEW.paused || VIEW.mode !== 'battle') return;
  const q = currentQ(); if (!q || q.k !== 'in') return;
  if (k === 'B') B.inVal = B.inVal.slice(0, -1);
  else if (k === 'S') { if (!B.inVal) { toast('先输入答案，再按确认'); return; } submit(B.inVal); return; }
  else if (B.inVal.length < 9) B.inVal += k;
  updatePadDisp();
  if (k !== 'B') sfx('type');
}
window.addEventListener('keydown', ev => {
  if (VIEW.mode !== 'battle') { if (ev.key === 'Escape' && VIEW.mode === 'map') { } return; }
  if (ev.key === 'Escape') { togglePause(); return; }
  if (VIEW.paused) return;
  const q = B && currentQ(); if (!q) return;
  if (q.k === 'in') {
    if (/^[0-9]$/.test(ev.key)) { ev.preventDefault(); padKey(ev.key); }
    else if (ev.key === '-' || ev.key === '.') { ev.preventDefault(); padKey(ev.key); }
    else if (ev.key === '/') { ev.preventDefault(); padKey('/'); }
    else if (ev.key === 'Backspace') { ev.preventDefault(); padKey('B'); }
    else if (ev.key === 'Enter') { ev.preventDefault(); padKey('S'); }
  } else {
    if (/^[1-4]$/.test(ev.key)) { const i = Number(ev.key) - 1; if (i < q.o.length) submit(String(i)); }
  }
});
function togglePause() {
  if (VIEW.mode !== 'battle' || B.over) return;
  VIEW.paused = !VIEW.paused;
  show('pause', VIEW.paused);
}

// ============ 题目气泡 ============
function wrapLines(text, maxW, font) {
  CTX.font = font;
  const out = [];
  let line = '';
  for (const ch of text) {
    if (CTX.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; }
    else line += ch;
  }
  if (line) out.push(line);
  return out;
}
function drawBubble(cx, topY, q, t, maxRight) {
  const font = '900 30px "Segoe UI","Microsoft YaHei",sans-serif';
  const lines = wrapLines(q.t, 560, font);
  const bw = Math.min(600, Math.max(...lines.map(l => { CTX.font = font; return CTX.measureText(l).width; })) + 56);
  const bh = lines.length * 40 + 30;
  let bx = cx - bw / 2;
  bx = clamp(bx, 30, (maxRight || Wd - 30) - bw);
  const by = topY;
  // 尾巴
  CTX.fillStyle = '#fff';
  CTX.beginPath(); CTX.moveTo(bx + bw * 0.3, by + bh); CTX.lineTo(bx + bw * 0.3 + 26, by + bh); CTX.lineTo(bx + bw * 0.3 + 4, by + bh + 22); CTX.fill();
  let border = B ? (B.w.accent || '#8a5a2a') : '#8a5a2a';
  if (B && B.phase === 'after') border = B.lastRight ? '#9ade54' : '#e05e5e';
  rr(bx, by, bw, bh, 16);
  CTX.fillStyle = 'rgba(255,255,255,.97)'; CTX.fill();
  CTX.strokeStyle = border; CTX.lineWidth = 5; CTX.stroke();
  CTX.fillStyle = '#2a2313'; CTX.font = font; CTX.textAlign = 'left'; CTX.textBaseline = 'middle';
  lines.forEach((l, i) => CTX.fillText(l, bx + 28, by + 31 + i * 40));
  return { bx, by, bw, bh };
}

const MENU_DECO = buildDeco();
function render(t) {
  CTX.save();
  if (VIEW.mode === 'battle' || VIEW.mode === 'result') {
    const sh = B ? B.shake : 0;
    if (sh > 0) CTX.translate(ri(-sh, sh) * 0.5, ri(-sh, sh) * 0.5);
    drawScene(B.w, t);
    drawPortal(t, B.w.accent);
    // BOSS 或 敌人
    if (B.boss && B.phase !== 'bossdie') {
      drawMonster(B.w.boss, BOSS_X, GROUND_Y, t, { boss: true, flash: B.boss.hitFlash > 0 });
      const q = currentQ();
      if (q && !B.over) drawBubble(BOSS_X, 200, q, t, 930);
    }
    if (B.enemy) {
      const e = B.enemy;
      CTX.save();
      if (e.x > PORTAL_X - 20) CTX.globalAlpha = clamp((SPAWN_X + 20 - e.x) / 70, 0.15, 1); // 从传送门钻出
      if (e.state === 'die') { const p = e.dieT / 0.5; CTX.globalAlpha = 1 - p; CTX.translate(0, -p * 60); CTX.rotate(p * 1.2); }
      if (e.state === 'atk') { const p = Math.min(1, e.t / 0.4); CTX.translate(-p * 90, -Math.sin(p * Math.PI) * 50); }
      drawMonster(e.kind, e.x, GROUND_Y, t, { flash: e.hitFlash > 0 });
      CTX.restore();
      const q = currentQ();
      if (q && (e.state === 'walk') && !B.over) {
        drawBubble(clamp(e.x, 400, 640), 170, q, t, 930);
      }
    }
    drawHero(t);
    // 金币
    for (const c of B.coins) {
      CTX.font = '22px serif'; CTX.textAlign = 'center'; CTX.globalAlpha = clamp(c.life, 0, 1);
      CTX.fillText('🪙', c.x, c.y); CTX.globalAlpha = 1;
    }
    // 火球
    for (const p of B.projs) {
      const k = clamp(p.t / p.dur, 0, 1);
      const x = lerp(p.x, p.tx, k), y = lerp(p.y, p.ty, k) - Math.sin(k * Math.PI) * 60;
      const fg = CTX.createRadialGradient(x, y, 2, x, y, 26);
      fg.addColorStop(0, '#fff8c0'); fg.addColorStop(0.4, '#ffd94d'); fg.addColorStop(1, 'rgba(255,140,40,0)');
      CTX.fillStyle = fg; CTX.beginPath(); CTX.arc(x, y, 26, 0, 7); CTX.fill();
      CTX.fillStyle = '#fff'; CTX.beginPath(); CTX.arc(x - 4, y - 4, 5, 0, 7); CTX.fill();
    }
    // 粒子
    for (const p of B.parts) {
      CTX.globalAlpha = clamp(p.life, 0, 1);
      CTX.fillStyle = p.c; CTX.beginPath(); CTX.arc(p.x, p.y, p.r, 0, 7); CTX.fill();
    }
    CTX.globalAlpha = 1;
    // 飘字
    for (const tx of B.texts) {
      CTX.globalAlpha = clamp(tx.life, 0, 1);
      CTX.font = `900 ${tx.s}px "Microsoft YaHei"`; CTX.textAlign = 'center';
      CTX.strokeStyle = 'rgba(0,0,0,.6)'; CTX.lineWidth = 4; CTX.strokeText(tx.txt, tx.x, tx.y);
      CTX.fillStyle = tx.c; CTX.fillText(tx.txt, tx.x, tx.y);
    }
    CTX.globalAlpha = 1;
    drawHUD();
    if (B.flashT > 0) { CTX.fillStyle = B.flashC; CTX.fillRect(0, 0, Wd, Ht); }
    // 暗角
    const vg = CTX.createRadialGradient(Wd / 2, Ht / 2, Ht * 0.45, Wd / 2, Ht / 2, Ht * 0.85);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.4)');
    CTX.fillStyle = vg; CTX.fillRect(0, 0, Wd, Ht);
    if (VIEW.paused) { CTX.fillStyle = 'rgba(0,0,0,.5)'; CTX.fillRect(0, 0, Wd, Ht); }
  } else {
    // 菜单/地图背景：随进度变换的世界场景
    const wi = clamp(Math.floor((SV.lv - 1) / 4), 0, 8);
    const w = WORLDS[wi];
    const savedB = B; B = null;
    drawScene(w, t * 0.4);
    B = savedB;
    const vg = CTX.createRadialGradient(Wd / 2, Ht / 2, Ht * 0.4, Wd / 2, Ht / 2, Ht * 0.9);
    vg.addColorStop(0, 'rgba(0,0,0,.1)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
    CTX.fillStyle = vg; CTX.fillRect(0, 0, Wd, Ht);
  }
  CTX.restore();
}

  $('btnExit').onclick = () => { sfx('click'); togglePause(); };
  $('btnPortal').onclick = () => { sfx('click'); location.href = 'index.html'; };
  $('btnStoryGo').onclick = () => { sfx('click'); const n = storyNext; SV.seenW = Math.max(SV.seenW || 0, LEVELS[n - 1].w + 1); storeSave(); startLevel(n); };
  $('btnNext').onclick = () => { sfx('click'); tryStartLevel(B.n + 1); };
  $('btnRetry').onclick = () => { sfx('click'); B.endless ? startEndless() : startLevel(B.n); };
  $('btnToMap').onclick = () => { sfx('click'); B.endless ? gotoMenu() : gotoMap(); };
  $('btnResume').onclick = () => { sfx('click'); togglePause(); };
  $('btnRestart').onclick = () => { sfx('click'); show('pause', false); VIEW.paused = false; B.endless ? startEndless() : startLevel(B.n); };
  $('btnQuit').onclick = () => { sfx('click'); show('pause', false); VIEW.paused = false; B = null; gotoMap(); };
  const updSet = () => {
    $('btnSfx').textContent = SV.set.sfx ? '🔊 音效：开' : '🔇 音效：关';
    $('btnBgm').textContent = SV.set.bgm ? '🎵 音乐：开' : '🎵 音乐：关';
  };
  $('btnSfx').onclick = () => { SV.set.sfx = SV.set.sfx ? 0 : 1; storeSave(); updSet(); sfx('click'); };
  $('btnBgm').onclick = () => { SV.set.bgm = SV.set.bgm ? 0 : 1; storeSave(); updSet(); if (!SV.set.bgm) bgmStop(); else if (VIEW.mode === 'battle' && B) bgmStart(B.L.w); sfx('click'); };
  $('btnReset').onclick = () => {
    if (!resetArmed) { resetArmed = true; $('btnReset').textContent = '⚠ 再点一次确认重置'; return; }
    clearSave(); storeSave(); resetArmed = false; $('btnReset').textContent = '🗑 重置进度';
    gotoMenu(); toast('进度已重置');
  };
  updSet();
  // 数字键盘
  document.querySelectorAll('#padGrid .pk').forEach(b => {
    b.addEventListener('click', () => padKey(b.dataset.k));
  });
  // 画布缩放
  const fit = () => {
    const s = Math.min(innerWidth / Wd, innerHeight / Ht);
    const wrap = $('wrap');
    wrap.style.transformOrigin = '50% 50%';
    // 窄屏：把答题控件移出缩放容器并固定到视口，画布上移避开键盘；宽屏恢复居中
    const narrow = innerWidth < 760;
    wrap.style.top = narrow ? '70px' : '50%';
    wrap.style.transform = narrow ? `translateX(-50%) scale(${s})` : `translate(-50%,-50%) scale(${s})`;
    for (const id of ['pad', 'choices']) {
      const el = $(id);
      if (narrow && el.parentElement.id === 'ui') { document.body.appendChild(el); el.classList.add('mobile-pad'); }
      else if (!narrow && el.parentElement === document.body) { $('ui').appendChild(el); el.classList.remove('mobile-pad'); }
    }
  };
  window.addEventListener('resize', fit); fit();
}

// ============================================================
//  测试钩子
// ============================================================
window.__math = {
  get save() { return JSON.parse(JSON.stringify(SV)); },
  get state() {
    if (!B) return null;
    const q = currentQ();
    return {
      mode: VIEW.mode, paused: VIEW.paused, level: B.endless ? 0 : B.n,
      qi: B.qi, n: B.endless ? -1 : B.L.n, over: B.over, win: B.win,
      hp: B.hero.hp, max: B.hero.max, shield: B.hero.shield, combo: B.hero.combo,
      enemy: B.enemy ? { x: Math.round(B.enemy.x), state: B.enemy.state, t: +B.enemy.t.toFixed(2), struck: !!B.enemy.struck } : null,
      boss: B.boss ? { hp: B.boss.hp, max: B.boss.max, charge: B.boss.charge } : null,
      goldRun: B.goldRun, wrongCount: B.wrongCount, right: B.right,
      q: q ? { t: q.t, k: q.k, a: q.k === 'ch' ? q.o[q.a] : q.a, src: q.src, opts: q.o } : null,
    };
  },
  // 直接开始第 n 关（跳过剧情/地图）
  start(n) { if (n >= 1 && n <= 36) { startLevel(n); return true; } return false; },
  endless() { startEndless(); return true; },
  // 提交当前题的正确/错误答案
  solve() {
    const q = currentQ(); if (!q || B.over) return false;
    submit(q.k === 'ch' ? String(q.a) : q.a); return true;
  },
  fail() {
    const q = currentQ(); if (!q || B.over) return false;
    if (q.k === 'ch') { const w = (q.a + 1) % q.o.length; submit(String(w)); }
    else submit(parseNum(q.a) === 0 ? '7' : '0');
    return true;
  },
  submit(v) { submit(String(v)); return true; },
  pad(k) { padKey(k); return true; },
  // 快进 n 帧
  pump(n, dt) { for (let i = 0; i < n; i++) update(dt || 1 / 60); return true; },
  // 跳过当前题等待动画（立即进入下一题）
  skipAnim() { if (B && B.lock && B.phase === 'after') { B.lockT = 0.01; return true; } return false; },
  // 生成器全量审计：每个生成器跑 N 样本，校验可解性与格式
  audit(N) {
    N = N || 100;
    const fails = [];
    const ids = Object.keys(G);
    for (const id of ids) {
      for (let i = 0; i < N; i++) {
        let q = null, err = '';
        try { q = G[id](); } catch (e) { err = '异常:' + e.message; }
        if (!err) {
          if (!q || typeof q.t !== 'string' || !q.t) err = '题面缺失';
          else if (q.k === 'ch') {
            if (!Array.isArray(q.o) || q.o.length < 2) err = '选项不足2个';
            else if (q.a < 0 || q.a >= q.o.length) err = '答案下标越界';
            else if (new Set(q.o).size !== q.o.length) err = '选项重复';
          } else {
            if (parseNum(q.a) === null) err = '输入题答案无法解析:' + q.a;
          }
        }
        if (err) { fails.push({ id, err, t: q && q.t, a: q && q.a }); break; }
      }
    }
    return { total: ids.length, fails };
  },
  // 校验答案判分正确性（含等价分数/小数）
  check(qa, val) { return isRight(qa, val); },
  gold(n) { SV.gold += n; storeSave(); return SV.gold; },
  unlockAll() {
    for (let n = 1; n <= 36; n++) SV.stars[n] = 3;
    SV.lv = 37; SV.seenW = 9; storeSave(); return true;
  },
  clearSave() { clearSave(); return true; },
  // 测试辅助：向存档合并字段（不校验，仅自动化测试用）
  patch(o) { Object.assign(SV, o); storeSave(); return true; },
  gotoMap() { gotoMap(); return true; },
  gotoMenu() { gotoMenu(); return true; },
  openShop() { openShop('map'); return true; },
  openBook() { openBook('map'); return true; },
  buy(k) {
    const s = SHOPS.find(x => x.k === k); if (!s) return false;
    const l = SV.up[k]; if (l >= s.max || SV.gold < s.cost(l)) return false;
    SV.gold -= s.cost(l); SV.up[k]++; storeSave(); return true;
  },
};

// ============================================================
//  启动
// ============================================================
try {
  bindUI();
  gotoMenu();
  requestAnimationFrame(loop);
} catch (e) {
  window.__bootErr.push('启动失败: ' + (e && e.message));
  try {
    document.body.insertAdjacentHTML('beforeend',
      `<div style="position:fixed;left:8px;bottom:8px;background:#500;color:#fff;padding:10px 14px;border-radius:8px;font:14px monospace;z-index:999">启动错误：${(e && e.message) || e}</div>`);
  } catch (e2) { }
}
</script>
</body>
